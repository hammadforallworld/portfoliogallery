<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="screen3Bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="skyAmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>

    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#screen3Bg)"/>
  <circle cx="450" cy="450" r="320" fill="#10b981" opacity="0.12"/>
  <circle cx="1200" cy="300" r="280" fill="#0284c7" opacity="0.1"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: HERO PHONE MOCKUP (TOURS & ITINERARY ROADMAP) -->
  <!-- ========================================================================= -->
  <g transform="translate(140, 70)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="380" height="760" rx="52" fill="#334155"/>
    <rect x="3" y="3" width="374" height="754" rx="49" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="352" height="732" rx="42" fill="#040711"/>

    <!-- Dynamic Island -->
    <rect x="130" y="24" width="120" height="28" rx="14" fill="#000000"/>
    <circle cx="233" cy="38" r="4" fill="#1e293b"/>

    <!-- Status Bar -->
    <text x="44" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">9:41</text>
    <g transform="translate(290, 32)" fill="#ffffff">
      <rect x="0" y="2" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="2" y="4" width="11" height="4" rx="1" fill="#10b981"/>
    </g>

    <!-- Tour Spots UI -->
    <g transform="translate(32, 70)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">CURATED EXPERIENCES</text>
      <text x="0" y="46" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Tours &amp; Activities</text>

      <!-- Search & Filters -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="288" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" font-family="'Inter', sans-serif" font-size="14">🔍</text>
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Search activities, excursions...</text>
      </g>

      <!-- Tour Spot 1: Sunset Catamaran Cruise -->
      <g transform="translate(0, 118)">
        <rect x="0" y="0" width="288" height="105" rx="14" fill="url(#cardDark)" stroke="#f59e0b" stroke-width="1.5"/>
        <rect x="12" y="12" width="76" height="80" rx="10" fill="#0284c7"/>
        <text x="50" y="58" font-family="'Inter', sans-serif" font-size="30" text-anchor="middle">⛵</text>
        
        <g transform="translate(98, 16)">
          <text x="0" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Sunset Yacht Cruise</text>
          <text x="0" y="30" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8">Santorini Caldera &amp; Snorkel</text>
          <text x="0" y="48" font-family="'Inter', sans-serif" font-size="9.5" fill="#f59e0b">★ 4.9 (420 reviews)</text>
          <text x="0" y="66" font-family="'Impact', 'Inter', sans-serif" font-size="16" fill="#10b981">$85 <tspan font-family="'Inter'" font-size="9" fill="#94a3b8">/ person</tspan></text>
          <rect x="115" y="52" width="62" height="22" rx="11" fill="#15803d"/>
          <text x="146" y="67" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">BOOK</text>
        </g>
      </g>

      <!-- Tour Spot 2: Kyoto Shrine Walk -->
      <g transform="translate(0, 235)">
        <rect x="0" y="0" width="288" height="105" rx="14" fill="url(#cardDark)" stroke="#334155" stroke-width="1"/>
        <rect x="12" y="12" width="76" height="80" rx="10" fill="#701a75"/>
        <text x="50" y="58" font-family="'Inter', sans-serif" font-size="30" text-anchor="middle">⛩️</text>
        
        <g transform="translate(98, 16)">
          <text x="0" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Kyoto Shrine Walk</text>
          <text x="0" y="30" font-family="'Inter', sans-serif" font-size="10" fill="#f472b6">Fushimi Inari &amp; Bamboo Forest</text>
          <text x="0" y="48" font-family="'Inter', sans-serif" font-size="9.5" fill="#f59e0b">★ 4.95 (850 reviews)</text>
          <text x="0" y="66" font-family="'Impact', 'Inter', sans-serif" font-size="16" fill="#10b981">$55 <tspan font-family="'Inter'" font-size="9" fill="#94a3b8">/ person</tspan></text>
          <rect x="115" y="52" width="62" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="146" y="67" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">BOOK</text>
        </g>
      </g>

      <!-- 3-Day Tour Itinerary Timeline Widget -->
      <g transform="translate(0, 352)">
        <rect x="0" y="0" width="288" height="150" rx="14" fill="url(#cardDark)" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Trip Itinerary Roadmap</text>
        <text x="210" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#10b981">Day 1 of 5</text>

        <!-- Steps -->
        <g transform="translate(18, 44)">
          <line x1="8" y1="10" x2="8" y2="78" stroke="#334155" stroke-width="2"/>
          
          <circle cx="8" cy="10" r="5" fill="#0284c7"/>
          <text x="22" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">09:00 AM • Private Airport Transfer</text>

          <circle cx="8" cy="46" r="5" fill="#f59e0b"/>
          <text x="22" y="50" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">02:00 PM • Cliffside Hotel Check-in</text>

          <circle cx="8" cy="82" r="5" fill="#10b981"/>
          <text x="22" y="86" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">06:30 PM • Sunset Wine Tasting Tour</text>
        </g>
      </g>
    </g>

    <g transform="translate(28, 645)">
      <line x1="0" y1="0" x2="296" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="40" cy="18" r="4" fill="#64748b"/>
      <circle cx="114" cy="18" r="4" fill="#64748b"/>
      <circle cx="188" cy="18" r="4" fill="#10b981"/>
      <circle cx="260" cy="18" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: TOURS & ITINERARY ARCHITECTURE -->
  <!-- ========================================================================= -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">SCREEN 3 • TOURS &amp; SPOTS</text>

    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#ffffff">Local Guided Excursions &amp;</text>
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#10b981">Automated Daily Itineraries</text>

    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8" line-height="1.6">
      <tspan x="0" dy="0">Interactive local tour marketplace featuring certified guides, skip-the-line museum tickets,</tspan>
      <tspan x="0" dy="28">and an AI-powered smart day-by-day itinerary planner with offline navigation.</tspan>
    </text>

    <g transform="translate(0, 240)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#064e3b"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🗺️</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Smart Dynamic Itinerary Planner</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Auto-clusters activities by geographic proximity to</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">minimize transit time and maximize sightseeing hours.</text>
      </g>

      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#0c4a6e"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">⛵</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Skip-the-Line &amp; Instant Pass</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Immediate digital barcode ticketing for catamarans, shrines,</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">national parks, and private culinary tasting excursions.</text>
      </g>

      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#581c87"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📍</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Offline Wayfinding &amp; Audio Guide</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Vector map tiles cached offline with turn-by-turn walking</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">directions and GPS geo-fenced historical audio narration.</text>
      </g>

      <g transform="translate(430, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#78350f"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🛡️</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Free 24h Cancellation Guarantee</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Flexible rebooking and full refunds for weather disruptions</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">backed by 24/7 multilingual customer concierge.</text>
      </g>
    </g>

    <g transform="translate(0, 520)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">CORE TECHNOLOGIES:</text>
      <g transform="translate(150, -3)">
        <rect x="0" y="0" width="125" height="30" rx="15" fill="#1e293b"/>
        <text x="62" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Mapbox Maps</text>
        
        <rect x="135" y="0" width="130" height="30" rx="15" fill="#1e293b"/>
        <text x="200" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">GetYourGuide API</text>

        <rect x="275" y="0" width="115" height="30" rx="15" fill="#1e293b"/>
        <text x="332" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">React Native</text>

        <rect x="400" y="0" width="130" height="30" rx="15" fill="#1e293b"/>
        <text x="465" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">Offline GeoJSON</text>
      </g>
    </g>
  </g>
</svg>
