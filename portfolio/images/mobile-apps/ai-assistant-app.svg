<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAiMob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#1d1b38"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgAiMob)"/>
  
  <text x="80" y="140" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">Mobile AI</text>
  <text x="80" y="175" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#06b6d4">Voice &amp; Text Assistant</text>
  <text x="80" y="210" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Conversational interface with real-time token streaming.</text>
  <text x="80" y="235" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">• Fast voice transcription</text>
  <text x="80" y="260" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">• Dark mode UI optimized for OLED screens</text>
  <text x="80" y="285" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">• Modular LLM backend connector</text>

  <!-- Centered Smartphone Frame -->
  <rect x="440" y="30" width="210" height="390" rx="30" fill="#080811" stroke="#312f54" stroke-width="4"/>
  <rect x="448" y="40" width="194" height="370" rx="22" fill="#0f0f1c"/>
  
  <!-- Notch -->
  <rect x="505" y="48" width="80" height="15" rx="7.5" fill="#000000"/>

  <!-- Chat Screen -->
  <rect x="460" y="85" width="170" height="45" rx="8" fill="#1e1e36"/>
  <text x="470" y="105" font-family="'Inter', sans-serif" font-size="10" fill="#e2e8f0">How can I assist your workflow</text>
  <text x="470" y="118" font-family="'Inter', sans-serif" font-size="10" fill="#a5b4fc">this morning?</text>

  <rect x="480" y="140" width="150" height="36" rx="8" fill="#655cf6"/>
  <text x="490" y="162" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff">Summarize latest sales logs</text>

  <rect x="460" y="186" width="170" height="60" rx="8" fill="#1e1e36"/>
  <text x="470" y="206" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#06b6d4">⚡ Analysis complete:</text>
  <text x="470" y="222" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">Q3 revenue up 18.4%.</text>
  <text x="470" y="234" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Top segment: AI automations.</text>

  <!-- Voice Waves -->
  <circle cx="545" cy="310" r="30" fill="#655cf6" opacity="0.2"/>
  <circle cx="545" cy="310" r="20" fill="#655cf6"/>
  <text x="545" y="316" font-family="'Inter', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">🎙️</text>

  <!-- Bottom Bar -->
  <rect x="460" y="365" width="170" height="32" rx="16" fill="#1b1b2f"/>
  <text x="475" y="385" font-family="'Inter', sans-serif" font-size="10" fill="#6b7280">Ask anything...</text>
</svg>
