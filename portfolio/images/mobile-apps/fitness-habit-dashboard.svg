        <text x="25" y="42" font-family="'Inter', sans-serif" font-size="20">🏋️</text>
        <text x="68" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Push Day • Upper Body</text>
