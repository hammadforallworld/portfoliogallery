        <rect x="0" y="0" width="288" height="58" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <g transform="translate(18, 12)">
          <text x="10" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">M</text>
          <circle cx="10" cy="28" r="11" fill="#10b981"/>
          <text x="10" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        </g>
        <g transform="translate(56, 12)">
          <text x="10" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">T</text>
          <circle cx="10" cy="28" r="11" fill="#10b981"/>
          <text x="10" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        </g>
        <g transform="translate(94, 12)">
          <text x="10" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">W</text>
          <circle cx="10" cy="28" r="11" fill="#10b981"/>
          <text x="10" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        </g>
        <g transform="translate(132, 12)">
          <text x="10" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">T</text>
          <circle cx="10" cy="28" r="11" fill="#10b981"/>
          <text x="10" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        </g>
        <g transform="translate(170, 12)">
          <text x="10" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">F</text>
          <circle cx="10" cy="28" r="11" fill="#10b981"/>
          <text x="10" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        </g>
        <g transform="translate(208, 12)">
          <text x="10" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#00f2fe" font-weight="bold" text-anchor="middle">S</text>
          <circle cx="10" cy="28" r="11" fill="#00f2fe"/>
          <text x="10" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#020617" text-anchor="middle">★</text>
        </g>
        <g transform="translate(246, 12)">
          <text x="10" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">S</text>
          <circle cx="10" cy="28" r="11" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
          <text x="10" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">19</text>
        </g>
