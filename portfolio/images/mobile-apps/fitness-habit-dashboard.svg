        <!-- Habit 1: Morning Run -->
        <rect x="0" y="0" width="288" height="74" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
        <rect x="14" y="16" width="42" height="42" rx="10" fill="#064e3b"/>
        <text x="25" y="42" font-family="'Inter', sans-serif" font-size="20">🏃</text>
