        <text x="14" y="20" font-family="'Inter', sans-serif" font-size="15">🔥</text>
        <text x="35" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fb923c">24d Streak</text>
      </g>

      <!-- Calendar Strip -->
