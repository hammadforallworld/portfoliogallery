<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <radialGradient id="screen1Bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Accents -->
    <linearGradient id="limeCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f2fe" flood-opacity="0.5"/>
    </filter>

    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#screen1Bg)"/>

  <!-- Ambient Light Blobs -->
  <circle cx="450" cy="450" r="300" fill="#00f2fe" opacity="0.12"/>
  <circle cx="1200" cy="300" r="280" fill="#10b981" opacity="0.1"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: PRISTINE HERO PHONE MOCKUP (HABIT TRACKER DASHBOARD) -->
  <!-- ========================================================================= -->
  <g transform="translate(140, 70)" filter="url(#phoneShadow)">
    <!-- Chassis -->
    <rect x="0" y="0" width="380" height="760" rx="52" fill="#334155"/>
    <rect x="3" y="3" width="374" height="754" rx="49" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="352" height="732" rx="42" fill="#040711"/>

    <!-- Dynamic Island -->
    <rect x="130" y="24" width="120" height="28" rx="14" fill="#000000"/>
    <circle cx="233" cy="38" r="4" fill="#1e293b"/>

    <!-- Status Bar -->
    <text x="44" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">9:41</text>
    <g transform="translate(290, 32)" fill="#ffffff">
      <rect x="0" y="2" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="2" y="4" width="11" height="4" rx="1" fill="#10b981"/>
    </g>

    <!-- Habit Dashboard UI -->
    <g transform="translate(32, 70)">
      <!-- Top Profile & Header -->
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1">PULSEHABIT ENGINE</text>
      <text x="0" y="46" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Daily Consistency</text>

      <!-- Flame Streak Banner -->
      <g transform="translate(170, 20)">
