        <rect x="0" y="0" width="252" height="44" rx="22" fill="url(#limeCyan)"/>
        <text x="126" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#020617" text-anchor="middle">+ ADD CUSTOM HABIT</text>
