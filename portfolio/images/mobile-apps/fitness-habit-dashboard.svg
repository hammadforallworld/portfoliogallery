    <rect x="0" y="0" width="240" height="34" rx="17" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <text x="120" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SCREEN 1 • HABIT ENGINE</text>

    <!-- Heading -->
    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#ffffff">Gamified Habit Streaks &amp;</text>
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#00f2fe">Daily Consistency Matrix</text>

    <!-- Description -->
    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8" line-height="1.6">
      <tspan x="0" dy="0">Engineered with React Native to maximize user retention and daily behavioral adherence.</tspan>
      <tspan x="0" dy="28">Combines micro-habit scheduling, visual streak momentum, and zero-latency local caching.</tspan>
    </text>

    <!-- 4 Architectural Feature Pillars -->
    <g transform="translate(0, 240)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#064e3b"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🔥</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Streak Momentum Engine</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Visual fire multiplier, streak shield freeze days, and</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">milestone badges for 7, 21, and 100 consecutive days.</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#0c4a6e"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">💧</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Hydration &amp; Nutrition Logging</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Interactive fluid animation with quick +250ml tap widgets,</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">custom volumetric targets, and smart reminder pushes.</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#581c87"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">⚡</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Offline-First Local Storage</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Instant 60 FPS UI transitions powered by AsyncStorage &amp;</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">SQLite, with non-blocking cloud syncing upon reconnect.</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(430, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#1e3a8a"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🔔</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Intelligent Smart Reminders</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Dynamic notification queues calculated from typical user</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">wake cycles, avoiding spam while sustaining focus.</text>
      </g>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 520)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">CORE TECHNOLOGIES:</text>
      <g transform="translate(150, -3)">
        <rect x="0" y="0" width="110" height="30" rx="15" fill="#1e293b"/>
        <text x="55" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">React Native</text>
        
        <rect x="120" y="0" width="105" height="30" rx="15" fill="#1e293b"/>
        <text x="172" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="middle">AsyncStorage</text>

        <rect x="235" y="0" width="100" height="30" rx="15" fill="#1e293b"/>
        <text x="285" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">TypeScript</text>

        <rect x="345" y="0" width="145" height="30" rx="15" fill="#1e293b"/>
        <text x="417" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">Push Notifications</text>
