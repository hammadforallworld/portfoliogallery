        <text x="68" y="48" font-family="'Inter', sans-serif" font-size="10.5" fill="#10b981">Completed • 06:45 AM • 420 kcal</text>
        <circle cx="260" cy="37" r="13" fill="#10b981"/>
        <path d="M 255 37 L 259 41 L 266 33" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
