<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <radialGradient id="screen2Bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanLimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="coralRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f2fe" flood-opacity="0.6"/>
    </filter>

    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>

    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#screen2Bg)"/>

  <!-- Ambient Light Blobs -->
  <circle cx="450" cy="450" r="320" fill="#f43f5e" opacity="0.12"/>
  <circle cx="1200" cy="300" r="280" fill="#00f2fe" opacity="0.1"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: HERO PHONE MOCKUP (LIVE WORKOUT & BIOMETRICS) -->
  <!-- ========================================================================= -->
  <g transform="translate(140, 70)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="380" height="760" rx="52" fill="#334155"/>
    <rect x="3" y="3" width="374" height="754" rx="49" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="352" height="732" rx="42" fill="#040711"/>

    <!-- Dynamic Island -->
    <rect x="130" y="24" width="120" height="28" rx="14" fill="#000000"/>
    <circle cx="233" cy="38" r="4" fill="#1e293b"/>

    <!-- Status Bar -->
    <text x="44" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">9:41</text>
    <g transform="translate(290, 32)" fill="#ffffff">
      <rect x="0" y="2" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="2" y="4" width="11" height="4" rx="1" fill="#10b981"/>
    </g>

    <!-- Workout Session Screen UI -->
    <g transform="translate(32, 70)">
      <!-- Top Session Header -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="288" height="38" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="19" r="6" fill="#10b981" filter="url(#glowLime)"/>
        <text x="34" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff">HIIT &amp; CARDIO SPRINT</text>
        <rect x="204" y="8" width="76" height="22" rx="11" fill="#064e3b"/>
        <text x="242" y="23" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">LIVE SYNC</text>
      </g>

      <!-- Active Timer -->
      <g transform="translate(0, 56)">
        <text x="144" y="38" font-family="'Impact', 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">42:15<tspan font-size="20" fill="#00f2fe">.8</tspan></text>
        <text x="144" y="58" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5">ACTIVE DURATION</text>
      </g>

      <!-- 3 CONCENTRIC ACTIVITY RINGS -->
      <g transform="translate(144, 185)">
        <!-- Outer: MOVE 642 / 700 kcal -->
        <circle cx="0" cy="0" r="68" fill="none" stroke="#3f121a" stroke-width="12"/>
        <circle cx="0" cy="0" r="68" fill="none" stroke="url(#coralRed)" stroke-width="12" stroke-dasharray="427" stroke-dashoffset="35" stroke-linecap="round" transform="rotate(-90)" filter="url(#glowRed)"/>
        
        <!-- Middle: EXERCISE 42 / 30 mins -->
        <circle cx="0" cy="0" r="50" fill="none" stroke="#052e16" stroke-width="12"/>
        <circle cx="0" cy="0" r="50" fill="none" stroke="url(#cyanLimeGrad)" stroke-width="12" stroke-dasharray="314" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)" filter="url(#glowLime)"/>

        <!-- Inner: STAND 10 / 12 hrs -->
        <circle cx="0" cy="0" r="32" fill="none" stroke="#082f49" stroke-width="12"/>
        <circle cx="0" cy="0" r="32" fill="none" stroke="#00f2fe" stroke-width="12" stroke-dasharray="201" stroke-dashoffset="32" stroke-linecap="round" transform="rotate(-90)" filter="url(#glowCyan)"/>

        <text x="0" y="8" font-family="'Inter', sans-serif" font-size="22" text-anchor="middle">⚡</text>
      </g>

      <!-- Triple Rings Badges -->
      <g transform="translate(0, 275)">
        <g transform="translate(10, 0)">
          <circle cx="8" cy="8" r="5" fill="#f43f5e"/>
          <text x="18" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">642 <tspan fill="#64748b" font-weight="normal">kcal</tspan></text>
        </g>
        <g transform="translate(105, 0)">
          <circle cx="8" cy="8" r="5" fill="#10b981"/>
          <text x="18" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">42 <tspan fill="#64748b" font-weight="normal">mins</tspan></text>
        </g>
        <g transform="translate(200, 0)">
          <circle cx="8" cy="8" r="5" fill="#00f2fe"/>
          <text x="18" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">10/12 <tspan fill="#64748b" font-weight="normal">hrs</tspan></text>
        </g>
      </g>

      <!-- LIVE BIOMETRIC HEART RATE & ECG CARD -->
      <g transform="translate(0, 305)">
        <rect x="0" y="0" width="288" height="98" rx="16" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
        <g transform="translate(16, 16)">
          <circle cx="16" cy="16" r="16" fill="#881337"/>
          <text x="16" y="22" font-family="'Inter', sans-serif" font-size="16" text-anchor="middle">❤️</text>
          <text x="42" y="16" font-family="'Impact', 'Inter', sans-serif" font-size="30" font-weight="900" fill="#ffffff">148</text>
          <text x="96" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f43f5e">BPM</text>
          <text x="42" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#34d399">Zone 4 • Fat Burn &amp; Peak</text>
        </g>
        <!-- ECG Waveform -->
        <g transform="translate(140, 20)">
          <path d="M 0 35 L 20 35 L 30 20 L 40 48 L 50 5 L 62 62 L 72 30 L 82 40 L 92 35 L 130 35" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
          <circle cx="130" cy="35" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
        </g>
      </g>

      <!-- Telemetry Grid -->
      <g transform="translate(0, 420)">
        <rect x="0" y="0" width="90" height="66" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="10" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#64748b">DISTANCE</text>
        <text x="10" y="44" font-family="'Impact', sans-serif" font-size="19" font-weight="bold" fill="#ffffff">6.82</text>
        <text x="50" y="44" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">km</text>

        <rect x="99" y="0" width="90" height="66" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="109" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#64748b">AVG PACE</text>
        <text x="109" y="44" font-family="'Impact', sans-serif" font-size="19" font-weight="bold" fill="#00f2fe">5'14"</text>
        <text x="154" y="44" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">/km</text>

        <rect x="198" y="0" width="90" height="66" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="208" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#64748b">ELEVATION</text>
        <text x="208" y="44" font-family="'Impact', sans-serif" font-size="19" font-weight="bold" fill="#10b981">+148</text>
        <text x="252" y="44" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">m</text>
      </g>

      <!-- Action Button: Pause -->
      <g transform="translate(0, 504)">
        <rect x="0" y="0" width="288" height="50" rx="25" fill="url(#cyanLimeGrad)" filter="url(#glowLime)"/>
        <text x="144" y="31" font-family="'Impact', 'Inter', sans-serif" font-size="15" font-weight="900" fill="#020617" text-anchor="middle" letter-spacing="1.5">⏸ PAUSE WORKOUT</text>
      </g>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(28, 645)">
      <line x1="0" y1="0" x2="296" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="40" cy="18" r="4" fill="#64748b"/>
      <circle cx="114" cy="18" r="4" fill="#00f2fe"/>
      <circle cx="188" cy="18" r="4" fill="#64748b"/>
      <circle cx="260" cy="18" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: TELEMETRY & BIOMETRIC ARCHITECTURE -->
  <!-- ========================================================================= -->
  <g transform="translate(620, 100)">
    <!-- Section Eyebrow -->
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#881337" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="130" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#fda4af" text-anchor="middle" letter-spacing="1">SCREEN 2 • WORKOUT TELEMETRY</text>

    <!-- Heading -->
    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#ffffff">Real-Time Biometrics &amp;</text>
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#f43f5e">Multi-Ring Motion Engine</text>

    <!-- Description -->
    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8" line-height="1.6">
      <tspan x="0" dy="0">High-frequency biometric sampling delivering live telemetry for HIIT, running, and endurance.</tspan>
      <tspan x="0" dy="28">Integrates seamlessly with wearable heart rate straps, smartwatches, and Apple HealthKit.</tspan>
    </text>

    <!-- 4 Architectural Feature Pillars -->
    <g transform="translate(0, 240)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#3f121a"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">⭕</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Concentric Activity Rings</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Move (Active Calories), Exercise (Cardio Minutes), and</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Stand (Hourly Mobility) rendered at a smooth 60 FPS.</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#881337"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">❤️</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">BLE Heart Rate &amp; Zone Tiers</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Dynamic heart rate zoning (Warm Up, Aerobic, Anaerobic,</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">and Peak Fat Burn) with instant audio haptic cues.</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#0c4a6e"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📍</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">GPS Telemetry &amp; Split Timing</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Kalman-filtered geolocation positioning recording accurate</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">stride pace, elevation gains, and automated kilometer splits.</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(430, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#064e3b"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📊</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Biometric Preflight Calibrator</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Algorithms factoring basal metabolic rate (BMR), weight,</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">and elevation delta for laboratory-grade calorie accuracy.</text>
      </g>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 520)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">CORE TECHNOLOGIES:</text>
      <g transform="translate(150, -3)">
        <rect x="0" y="0" width="135" height="30" rx="15" fill="#1e293b"/>
        <text x="67" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f43f5e" text-anchor="middle">BLE Sensor APIs</text>
        
        <rect x="145" y="0" width="125" height="30" rx="15" fill="#1e293b"/>
        <text x="207" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">SVG Motion Path</text>

        <rect x="280" y="0" width="130" height="30" rx="15" fill="#1e293b"/>
        <text x="345" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Apple HealthKit</text>

        <rect x="420" y="0" width="120" height="30" rx="15" fill="#1e293b"/>
        <text x="480" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">GPS Geolocation</text>
      </g>
    </g>
  </g>
</svg>
