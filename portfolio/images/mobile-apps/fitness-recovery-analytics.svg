<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <radialGradient id="screen3Bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanLimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="barActiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>

    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#screen3Bg)"/>

  <!-- Ambient Light Blobs -->
  <circle cx="450" cy="450" r="320" fill="#10b981" opacity="0.12"/>
  <circle cx="1200" cy="300" r="280" fill="#8b5cf6" opacity="0.1"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: HERO PHONE MOCKUP (RECOVERY & PERFORMANCE ENGINE) -->
  <!-- ========================================================================= -->
  <g transform="translate(140, 70)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="380" height="760" rx="52" fill="#334155"/>
    <rect x="3" y="3" width="374" height="754" rx="49" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="352" height="732" rx="42" fill="#040711"/>

    <!-- Dynamic Island -->
    <rect x="130" y="24" width="120" height="28" rx="14" fill="#000000"/>
    <circle cx="233" cy="38" r="4" fill="#1e293b"/>

    <!-- Status Bar -->
    <text x="44" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">9:41</text>
    <g transform="translate(290, 32)" fill="#ffffff">
      <rect x="0" y="2" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="2" y="4" width="11" height="4" rx="1" fill="#10b981"/>
    </g>

    <!-- Recovery Screen UI -->
    <g transform="translate(32, 70)">
      <!-- Top Title -->
      <text x="0" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">BIO-RECOVERY SCORE</text>
      <text x="0" y="48" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Readiness &amp; Sleep</text>

      <!-- Recovery Hero Card with Circular Gauge -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="288" height="135" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
        
        <!-- Gauge Ring Arc -->
        <g transform="translate(68, 68)">
          <circle cx="0" cy="0" r="45" fill="none" stroke="#1e293b" stroke-width="10"/>
          <circle cx="0" cy="0" r="45" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="282" stroke-dashoffset="30" stroke-linecap="round" transform="rotate(-90)" filter="url(#glowLime)"/>
          <text x="0" y="4" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">94%</text>
          <text x="0" y="18" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#10b981" text-anchor="middle">OPTIMAL</text>
        </g>

        <!-- Recovery Stats List -->
        <g transform="translate(140, 24)">
          <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Physiological Readiness</text>
          <text x="0" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">HRV: <tspan fill="#10b981" font-weight="bold">68 ms (+12%)</tspan></text>
          <text x="0" y="50" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Resting HR: <tspan fill="#00f2fe" font-weight="bold">52 BPM</tspan></text>
          <text x="0" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Muscle Recovery: <tspan fill="#a855f7" font-weight="bold">Full</tspan></text>
          <rect x="0" y="78" width="135" height="18" rx="9" fill="#064e3b"/>
          <text x="67" y="90" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#34d399" text-anchor="middle">Prime for High Intensity</text>
        </g>
      </g>

      <!-- Sleep Architecture Card -->
      <g transform="translate(0, 215)">
        <rect x="0" y="0" width="288" height="98" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <g transform="translate(16, 20)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="14">🌙</text>
          <text x="24" y="12" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Sleep Architecture</text>
          <text x="195" y="12" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#38bdf8">7h 48m</text>
          
          <g transform="translate(0, 26)">
            <rect x="0" y="0" width="256" height="10" rx="5" fill="#1e293b"/>
            <rect x="0" y="0" width="62" height="10" rx="5" fill="#8b5cf6"/>
            <rect x="65" y="0" width="82" height="10" rx="0" fill="#0284c7"/>
            <rect x="150" y="0" width="95" height="10" rx="0" fill="#38bdf8"/>
            <rect x="248" y="0" width="8" height="10" rx="2" fill="#f43f5e"/>
          </g>

          <g transform="translate(0, 52)" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">
            <circle cx="4" cy="0" r="3" fill="#8b5cf6"/>
            <text x="12" y="3">Deep 2h 10m</text>
            <circle cx="82" cy="0" r="3" fill="#0284c7"/>
            <text x="90" y="3">REM 2h 45m</text>
            <circle cx="165" cy="0" r="3" fill="#38bdf8"/>
            <text x="173" y="3">Light 2h 53m</text>
          </g>
        </g>
      </g>

      <!-- Weekly Calorie Expenditure Bar Chart -->
      <g transform="translate(0, 325)">
        <rect x="0" y="0" width="288" height="135" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Weekly Calorie Burn</text>
        <text x="210" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#00f2fe">4,850 kcal</text>

        <!-- Chart Grid Lines -->
        <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6">
          <line x1="20" y1="45" x2="268" y2="45"/>
          <line x1="20" y1="75" x2="268" y2="75"/>
          <line x1="20" y1="105" x2="268" y2="105"/>
        </g>

        <!-- 7 Day Bars -->
        <g transform="translate(28, 45)">
          <rect x="0" y="25" width="18" height="40" rx="4" fill="#334155"/>
          <text x="9" y="75" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">M</text>
        </g>
        <g transform="translate(62, 45)">
          <rect x="0" y="15" width="18" height="50" rx="4" fill="url(#barActiveGrad)"/>
          <text x="9" y="75" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">T</text>
        </g>
        <g transform="translate(96, 45)">
          <rect x="0" y="28" width="18" height="37" rx="4" fill="#334155"/>
          <text x="9" y="75" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">W</text>
        </g>
        <g transform="translate(130, 45)">
          <rect x="0" y="10" width="18" height="55" rx="4" fill="url(#barActiveGrad)"/>
          <text x="9" y="75" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">T</text>
        </g>
        <g transform="translate(164, 45)">
          <rect x="0" y="0" width="18" height="65" rx="4" fill="url(#cyanLimeGrad)" filter="url(#glowLime)"/>
          <text x="9" y="-6" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#10b981" text-anchor="middle">850</text>
          <text x="9" y="75" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#00f2fe" text-anchor="middle">F</text>
        </g>
        <g transform="translate(198, 45)">
          <rect x="0" y="8" width="18" height="57" rx="4" fill="url(#barActiveGrad)"/>
          <text x="9" y="75" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">S</text>
        </g>
        <g transform="translate(232, 45)">
          <rect x="0" y="35" width="18" height="30" rx="4" fill="#1e293b"/>
          <text x="9" y="75" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">S</text>
        </g>
      </g>

      <!-- Achievement Badges Strip -->
      <g transform="translate(0, 472)">
        <rect x="0" y="0" width="138" height="58" rx="12" fill="url(#cardGrad)" stroke="#eab308" stroke-width="1"/>
        <text x="14" y="35" font-family="'Inter', sans-serif" font-size="18">🏆</text>
        <text x="38" y="25" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Century Club</text>
        <text x="38" y="41" font-family="'Inter', sans-serif" font-size="9" fill="#facc15">100 Workouts</text>

        <rect x="150" y="0" width="138" height="58" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1"/>
        <text x="164" y="35" font-family="'Inter', sans-serif" font-size="18">⚡</text>
        <text x="188" y="25" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Master Pacer</text>
        <text x="188" y="41" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8">Top 5% Speed</text>
      </g>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(28, 645)">
      <line x1="0" y1="0" x2="296" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="40" cy="18" r="4" fill="#64748b"/>
      <circle cx="114" cy="18" r="4" fill="#64748b"/>
      <circle cx="188" cy="18" r="4" fill="#10b981"/>
      <circle cx="260" cy="18" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: PERFORMANCE & BIO-RECOVERY ARCHITECTURE -->
  <!-- ========================================================================= -->
  <g transform="translate(620, 100)">
    <!-- Section Eyebrow -->
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">SCREEN 3 • RECOVERY &amp; SLEEP</text>

    <!-- Heading -->
    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#ffffff">Physiological Recovery &amp;</text>
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#10b981">Circadian Sleep Analytics</text>

    <!-- Description -->
    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8" line-height="1.6">
      <tspan x="0" dy="0">Synthesizes nocturnal Heart Rate Variability (HRV), resting heart rate, and hypnograms.</tspan>
      <tspan x="0" dy="28">Calculates autonomic nervous system balance to give athletes an objective 0–100% readiness score.</tspan>
    </text>

    <!-- 4 Architectural Feature Pillars -->
    <g transform="translate(0, 240)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#064e3b"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🧬</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">HRV Autonomic Readiness</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">rMSSD biometric sampling measuring parasympathetic</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">activation to predict muscular overload and prevent burnout.</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#581c87"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🌙</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Multi-Phase Sleep Hypnogram</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Color-coded sleep architecture breaking down Deep,</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">REM, and Light cycles with sleep debt tracking.</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#0c4a6e"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📈</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Weekly Metabolic Volume</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">7-day rolling calorie bar chart with Friday peak callouts</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">and automatic weekly caloric expenditure averages.</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(430, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#713f12"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🏆</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Gamified Badges &amp; PDF Export</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Unlockable milestone trophies plus one-click PDF / CSV</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">health summary export for medical or coaching consultations.</text>
      </g>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 520)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">CORE TECHNOLOGIES:</text>
      <g transform="translate(150, -3)">
        <rect x="0" y="0" width="135" height="30" rx="15" fill="#1e293b"/>
        <text x="67" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">HRV Algorithmic Core</text>
        
        <rect x="145" y="0" width="130" height="30" rx="15" fill="#1e293b"/>
        <text x="210" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#8b5cf6" text-anchor="middle">Sleep Hypnogram</text>

        <rect x="285" y="0" width="120" height="30" rx="15" fill="#1e293b"/>
        <text x="345" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Bar Chart Canvas</text>

        <rect x="415" y="0" width="125" height="30" rx="15" fill="#1e293b"/>
        <text x="477" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">CSV/PDF Export</text>
      </g>
    </g>
  </g>
</svg>
