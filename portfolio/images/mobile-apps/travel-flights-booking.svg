<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="screen1Bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="skyAmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glowSky" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>

    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#screen1Bg)"/>
  <circle cx="450" cy="450" r="320" fill="#0284c7" opacity="0.12"/>
  <circle cx="1200" cy="300" r="280" fill="#38bdf8" opacity="0.1"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: HERO PHONE MOCKUP (FLIGHT BOOKING & BOARDING PASS) -->
  <!-- ========================================================================= -->
  <g transform="translate(140, 70)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="380" height="760" rx="52" fill="#334155"/>
    <rect x="3" y="3" width="374" height="754" rx="49" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="352" height="732" rx="42" fill="#040711"/>

    <!-- Dynamic Island -->
    <rect x="130" y="24" width="120" height="28" rx="14" fill="#000000"/>
    <circle cx="233" cy="38" r="4" fill="#1e293b"/>

    <!-- Status Bar -->
    <text x="44" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">9:41</text>
    <g transform="translate(290, 32)" fill="#ffffff">
      <rect x="0" y="2" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="2" y="4" width="11" height="4" rx="1" fill="#0284c7"/>
    </g>

    <!-- Flight Booking UI -->
    <g transform="translate(32, 70)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">SKYVOYAGE AIR ENGINE</text>
      <text x="0" y="46" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Flight Search &amp; Tickets</text>

      <!-- Round Trip Selector -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="288" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="3" y="3" width="140" height="32" rx="8" fill="#0284c7"/>
        <text x="73" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Round Trip</text>
        <text x="214" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">One Way</text>
      </g>

      <!-- Route Card: LHR ✈ HND -->
      <g transform="translate(0, 118)">
        <rect x="0" y="0" width="288" height="110" rx="14" fill="url(#cardDark)" stroke="#0284c7" stroke-width="1.5"/>
        <g transform="translate(16, 20)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">FROM</text>
          <text x="0" y="40" font-family="'Impact', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff">LHR</text>
          <text x="0" y="58" font-family="'Inter', sans-serif" font-size="10.5" fill="#38bdf8">London, UK</text>
          <text x="0" y="74" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">10:30 AM</text>
        </g>

        <g transform="translate(120, 35)">
          <line x1="0" y1="15" x2="48" y2="15" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
          <circle cx="24" cy="15" r="14" fill="#0284c7" filter="url(#glowSky)"/>
          <text x="24" y="20" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✈</text>
          <text x="24" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">11h 45m</text>
          <text x="24" y="54" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#10b981" text-anchor="middle">Non-stop</text>
        </g>

        <g transform="translate(205, 20)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">TO</text>
          <text x="0" y="40" font-family="'Impact', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff">HND</text>
          <text x="0" y="58" font-family="'Inter', sans-serif" font-size="10.5" fill="#38bdf8">Tokyo, JP</text>
          <text x="0" y="74" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">07:15 AM (+1)</text>
        </g>
      </g>

      <!-- Digital Boarding Pass Ticket with Barcode -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="288" height="230" rx="14" fill="url(#cardDark)" stroke="#334155" stroke-width="1"/>
        <rect x="0" y="0" width="288" height="44" rx="14" fill="#0369a1"/>
        <text x="16" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">SkyWings Boeing 787-9</text>
        <rect x="215" y="11" width="58" height="22" rx="11" fill="#0284c7"/>
        <text x="244" y="26" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">$640</text>

        <g transform="translate(16, 64)">
          <g>
            <text x="0" y="12" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">PASSENGER</text>
            <text x="0" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Hammad Hassan</text>
          </g>
          <g transform="translate(125, 0)">
            <text x="0" y="12" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">GATE</text>
            <text x="0" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">B24</text>
          </g>
          <g transform="translate(195, 0)">
            <text x="0" y="12" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">SEAT</text>
            <text x="0" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">12A (Window)</text>
          </g>
        </g>

        <line x1="0" y1="120" x2="288" y2="120" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
        <circle cx="0" cy="120" r="8" fill="#040711"/>
        <circle cx="288" cy="120" r="8" fill="#040711"/>

        <!-- Barcode section -->
        <g transform="translate(16, 138)">
          <text x="0" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#10b981">✓ BOARDING PASS READY • TERMINAL 3</text>
          <g transform="translate(0, 26)" fill="#cbd5e1">
            <rect x="0" y="0" width="3" height="38"/>
            <rect x="6" y="0" width="2" height="38"/>
            <rect x="11" y="0" width="5" height="38"/>
            <rect x="19" y="0" width="2" height="38"/>
            <rect x="24" y="0" width="4" height="38"/>
            <rect x="31" y="0" width="3" height="38"/>
            <rect x="37" y="0" width="6" height="38"/>
            <rect x="46" y="0" width="2" height="38"/>
            <rect x="51" y="0" width="5" height="38"/>
            <rect x="59" y="0" width="2" height="38"/>
            <rect x="64" y="0" width="4" height="38"/>
            <rect x="71" y="0" width="3" height="38"/>
            <rect x="77" y="0" width="5" height="38"/>
            <rect x="85" y="0" width="2" height="38"/>
            <rect x="90" y="0" width="6" height="38"/>
            <rect x="99" y="0" width="3" height="38"/>
            <rect x="105" y="0" width="4" height="38"/>
            <rect x="112" y="0" width="2" height="38"/>
            <rect x="117" y="0" width="5" height="38"/>
            <rect x="125" y="0" width="3" height="38"/>
            <rect x="131" y="0" width="2" height="38"/>
            <rect x="136" y="0" width="6" height="38"/>
            <rect x="145" y="0" width="4" height="38"/>
            <rect x="152" y="0" width="2" height="38"/>
            <rect x="157" y="0" width="5" height="38"/>
            <rect x="165" y="0" width="3" height="38"/>
            <rect x="171" y="0" width="4" height="38"/>
            <rect x="178" y="0" width="6" height="38"/>
            <rect x="187" y="0" width="2" height="38"/>
            <rect x="192" y="0" width="5" height="38"/>
            <rect x="200" y="0" width="3" height="38"/>
            <rect x="206" y="0" width="2" height="38"/>
            <rect x="211" y="0" width="5" height="38"/>
            <rect x="219" y="0" width="4" height="38"/>
            <rect x="226" y="0" width="6" height="38"/>
            <rect x="235" y="0" width="2" height="38"/>
            <rect x="240" y="0" width="5" height="38"/>
            <rect x="248" y="0" width="3" height="38"/>
            <rect x="254" y="0" width="2" height="38"/>
          </g>
        </g>
      </g>

      <!-- Action Button -->
      <g transform="translate(18, 490)">
        <rect x="0" y="0" width="252" height="46" rx="23" fill="url(#skyAmberGrad)" filter="url(#glowSky)"/>
        <text x="126" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ADD PASS TO APPLE WALLET</text>
      </g>
    </g>

    <g transform="translate(28, 645)">
      <line x1="0" y1="0" x2="296" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="40" cy="18" r="4" fill="#38bdf8"/>
      <circle cx="114" cy="18" r="4" fill="#64748b"/>
      <circle cx="188" cy="18" r="4" fill="#64748b"/>
      <circle cx="260" cy="18" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: FLIGHT ENGINE ARCHITECTURE & FEATURES -->
  <!-- ========================================================================= -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#bae6fd" text-anchor="middle" letter-spacing="1">SCREEN 1 • FLIGHT BOOKING</text>

    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#ffffff">Global Airline Aggregator &amp;</text>
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#38bdf8">Live Digital Boarding Pass</text>

    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8" line-height="1.6">
      <tspan x="0" dy="0">High-speed flight search engine querying 500+ commercial carriers across international hubs.</tspan>
      <tspan x="0" dy="28">Features seat tier visualizers, gate change push alerts, and offline digital boarding passes.</tspan>
    </text>

    <g transform="translate(0, 240)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#0c4a6e"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">✈️</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Real-Time Global GDS Search</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Instant route pricing across Amadeus, Sabre, and direct</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">airline NDC APIs with zero markup transparency.</text>
      </g>

      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#713f12"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🎫</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Scannable PKPass &amp; Barcode</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">One-tap sync to Apple Wallet and Google Wallet with</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">airport TSA pre-check compatibility and terminal maps.</text>
      </g>

      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#064e3b"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">💺</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Interactive 3D Aircraft Cabin</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Select window, aisle, or extra-legroom seats with live</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">seat map availability and aircraft specs (Boeing 787 / A350).</text>
      </g>

      <g transform="translate(430, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#581c87"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🔔</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Automated Flight Radar Tracking</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Live telemetry pushes for gate changes, boarding calls,</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">baggage carousel assignment, and flight delays.</text>
      </g>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 520)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">CORE TECHNOLOGIES:</text>
      <g transform="translate(150, -3)">
        <rect x="0" y="0" width="115" height="30" rx="15" fill="#1e293b"/>
        <text x="57" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Airline APIs</text>
        
        <rect x="125" y="0" width="125" height="30" rx="15" fill="#1e293b"/>
        <text x="187" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">Apple Wallet Kit</text>

        <rect x="260" y="0" width="110" height="30" rx="15" fill="#1e293b"/>
        <text x="315" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">React Native</text>

        <rect x="380" y="0" width="125" height="30" rx="15" fill="#1e293b"/>
        <text x="442" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">Push Telemetry</text>
      </g>
    </g>
  </g>
</svg>
