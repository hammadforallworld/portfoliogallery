<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="screen2Bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="skyAmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="santoriniSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glowSky" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>

    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#screen2Bg)"/>
  <circle cx="450" cy="450" r="320" fill="#f59e0b" opacity="0.12"/>
  <circle cx="1200" cy="300" r="280" fill="#0284c7" opacity="0.1"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: HERO PHONE MOCKUP (DESTINATION EXPLORER) -->
  <!-- ========================================================================= -->
  <g transform="translate(140, 70)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="380" height="760" rx="52" fill="#334155"/>
    <rect x="3" y="3" width="374" height="754" rx="49" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="352" height="732" rx="42" fill="#040711"/>

    <!-- Dynamic Island -->
    <rect x="130" y="24" width="120" height="28" rx="14" fill="#000000"/>
    <circle cx="233" cy="38" r="4" fill="#1e293b"/>

    <!-- Status Bar -->
    <text x="44" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">9:41</text>
    <g transform="translate(290, 32)" fill="#ffffff">
      <rect x="0" y="2" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="2" y="4" width="11" height="4" rx="1" fill="#0284c7"/>
    </g>

    <!-- Destination Screen UI -->
    <g transform="translate(32, 70)">
      <g transform="translate(0, 0)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">DISCOVER THE WORLD</text>
        <text x="0" y="42" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#ffffff">Explore Destinations</text>
        <circle cx="265" cy="24" r="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="265" y="29" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">🔔</text>
      </g>

      <!-- Search -->
      <g transform="translate(0, 58)">
        <rect x="0" y="0" width="288" height="42" rx="12" fill="url(#cardDark)" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="15">🔍</text>
        <text x="38" y="26" font-family="'Inter', sans-serif" font-size="11.5" fill="#94a3b8">Search cities, beaches, flights...</text>
      </g>

      <!-- Category Filter Chips -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="55" height="28" rx="14" fill="#0284c7"/>
        <text x="27" y="18" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">All</text>

        <rect x="63" y="0" width="70" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="98" y="18" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">✈ Flights</text>

        <rect x="141" y="0" width="74" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="178" y="18" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">🏝 Beaches</text>

        <rect x="223" y="0" width="65" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="255" y="18" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">⛰ Tours</text>
      </g>

      <!-- Featured Destination Card: Santorini -->
      <g transform="translate(0, 154)">
        <rect x="0" y="0" width="288" height="215" rx="18" fill="url(#cardDark)" stroke="#0284c7" stroke-width="1.5"/>
        
        <!-- Artwork -->
        <rect x="0" y="0" width="288" height="135" rx="18" fill="url(#santoriniSea)"/>
        <circle cx="225" cy="45" r="22" fill="#fde047" opacity="0.9"/>
        <path d="M 0,135 L 50,75 L 110,75 L 140,55 L 190,55 L 220,85 L 288,105 L 288,135 Z" fill="#ffffff"/>
        <path d="M 145,55 Q 165,25 185,55 Z" fill="#0284c7"/>
        <line x1="165" y1="25" x2="165" y2="18" stroke="#ffffff" stroke-width="2"/>
        <rect x="60" y="45" width="20" height="30" fill="#f8fafc"/>
        <polygon points="56,45 70,30 84,45" fill="#b45309"/>

        <!-- Rating Pill -->
        <rect x="14" y="14" width="74" height="24" rx="12" fill="#020617" opacity="0.8"/>
        <text x="51" y="30" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">★ 4.9 (2.4k)</text>

        <!-- Destination Details -->
        <g transform="translate(16, 152)">
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Santorini, Greece</text>
          <text x="0" y="34" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Aegean Island • 5 Days Package</text>
          
          <g transform="translate(160, 0)">
            <text x="95" y="18" font-family="'Impact', 'Inter', sans-serif" font-size="22" font-weight="900" fill="#f59e0b" text-anchor="end">$890</text>
            <text x="95" y="32" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="end">Flight + Hotel</text>
          </g>
        </g>
      </g>

      <!-- Popular Spots: Kyoto & Bali -->
      <g transform="translate(0, 382)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Popular Spots</text>
        <text x="288" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="end">View All</text>

        <!-- Kyoto -->
        <g transform="translate(0, 26)">
          <rect x="0" y="0" width="138" height="98" rx="14" fill="url(#cardDark)" stroke="#334155" stroke-width="1"/>
          <rect x="8" y="8" width="122" height="50" rx="8" fill="#4a044e"/>
          <text x="69" y="40" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🌸 Kyoto</text>
          <text x="10" y="74" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Kyoto, Japan</text>
          <text x="10" y="88" font-family="'Inter', sans-serif" font-size="9.5" fill="#10b981">$750 • 4.9★</text>
        </g>

        <!-- Bali -->
        <g transform="translate(150, 26)">
          <rect x="0" y="0" width="138" height="98" rx="14" fill="url(#cardDark)" stroke="#334155" stroke-width="1"/>
          <rect x="8" y="8" width="122" height="50" rx="8" fill="#064e3b"/>
          <text x="69" y="40" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🌴 Bali</text>
          <text x="10" y="74" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Bali, Indonesia</text>
          <text x="10" y="88" font-family="'Inter', sans-serif" font-size="9.5" fill="#10b981">$520 • 4.8★</text>
        </g>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 520)">
        <rect x="0" y="0" width="288" height="48" rx="24" fill="url(#skyAmberGrad)" filter="url(#glowSky)"/>
        <text x="144" y="30" font-family="'Impact', 'Inter', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">✈ BOOK COMPLETE VACATION</text>
      </g>
    </g>

    <g transform="translate(28, 645)">
      <line x1="0" y1="0" x2="296" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="40" cy="18" r="4" fill="#64748b"/>
      <circle cx="114" cy="18" r="4" fill="#38bdf8"/>
      <circle cx="188" cy="18" r="4" fill="#64748b"/>
      <circle cx="260" cy="18" r="4" fill="#64748b"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: DESTINATION DISCOVERY ARCHITECTURE -->
  <!-- ========================================================================= -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="250" height="34" rx="17" fill="#713f12" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="125" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="1">SCREEN 2 • DESTINATION DISCOVERY</text>

    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#ffffff">Intelligent Destination Curation &amp;</text>
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#f59e0b">All-Inclusive Travel Packages</text>

    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8" line-height="1.6">
      <tspan x="0" dy="0">Discover over 1,200 handpicked vacation destinations filtered by climate, budget, and season.</tspan>
      <tspan x="0" dy="28">Combines real-time hotel availability, flight pairings, and dynamic bundle discounts.</tspan>
    </text>

    <g transform="translate(0, 240)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#0c4a6e"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🏝️</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Dynamic Vacation Bundler</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Instant 20% package savings when combining flights with</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">4-star and 5-star cliffside boutique villas and resorts.</text>
      </g>

      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#78350f"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">☀️</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Microclimate Weather Radar</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Historical seasonal temperature, sunlight hours, and ocean</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">swim conditions helping travelers select peak months.</text>
      </g>

      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#581c87"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🎯</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Vibe Trip Matching</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Personalized recommendations tailored to user style:</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">relaxing beaches, cultural shrines, or mountain trails.</text>
      </g>

      <g transform="translate(430, 125)">
        <rect x="0" y="0" width="410" height="105" rx="16" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="38" cy="38" r="20" fill="#064e3b"/>
        <text x="38" y="44" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">⭐</text>
        <text x="72" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Verified Traveler Reviews</text>
        <text x="72" y="58" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Crowdsourced traveler photo feedback, food ratings,</text>
        <text x="72" y="78" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">and verified booking badges for peace of mind.</text>
      </g>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 520)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">CORE TECHNOLOGIES:</text>
      <g transform="translate(150, -3)">
        <rect x="0" y="0" width="125" height="30" rx="15" fill="#1e293b"/>
        <text x="62" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Hotel Beds API</text>
        
        <rect x="135" y="0" width="125" height="30" rx="15" fill="#1e293b"/>
        <text x="197" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">Weather Engine</text>

        <rect x="270" y="0" width="115" height="30" rx="15" fill="#1e293b"/>
        <text x="327" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">React Native</text>

        <rect x="395" y="0" width="130" height="30" rx="15" fill="#1e293b"/>
        <text x="460" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">Vector Search</text>
      </g>
    </g>
  </g>
</svg>
