<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" width="100%" height="100%">
  <!-- Clean High-Contrast Translation Showcase Canvas -->
  <rect width="800" height="475" fill="#f8fafc"/>
  <rect x="0" y="0" width="800" height="475" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="400" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">Bilingual Localization &amp; Translation Package</text>

  <!-- Left Source Document Panel -->
  <rect x="60" y="65" width="325" height="370" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.06))"/>
  <rect x="60" y="65" width="325" height="38" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="85" y="89" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#1e293b">English Source (EN-US)</text>
  <text x="360" y="89" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="end">Verified ✔</text>

  <text x="85" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Cloud Automation Architecture</text>
  <text x="85" y="155" font-family="'Inter', sans-serif" font-size="10.5" fill="#475569" line-height="1.5">The platform provisions elastic microservices</text>
  <text x="85" y="175" font-family="'Inter', sans-serif" font-size="10.5" fill="#475569">based on real-time computational demand</text>
  <text x="85" y="195" font-family="'Inter', sans-serif" font-size="10.5" fill="#475569">and concurrent API requests.</text>

  <rect x="85" y="225" width="275" height="1" fill="#e2e8f0"/>
  <text x="85" y="250" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Technical Terms Identified:</text>
  <rect x="85" y="265" width="275" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="98" y="285" font-family="'Inter', sans-serif" font-size="9.5" fill="#505ff6">• Elastic Microservices: Scalable pods</text>

  <rect x="85" y="305" width="275" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="98" y="325" font-family="'Inter', sans-serif" font-size="9.5" fill="#505ff6">• Concurrency: Parallel user sessions</text>

  <!-- Right Target Document Panel -->
  <rect x="415" y="65" width="325" height="370" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.06))"/>
  <rect x="415" y="65" width="325" height="38" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="440" y="89" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#15803d">Target Translation &amp; Typesetting</text>
  <text x="715" y="89" font-family="'Inter', sans-serif" font-size="10" fill="#16a34a" text-anchor="end">100% Quality</text>

  <text x="440" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#0f172a">خودکار کلاؤڈ آرکیٹیکچر</text>
  <text x="440" y="155" font-family="'Inter', sans-serif" font-size="11" fill="#334155">یہ نظام لچکدار مائیکروسروسز فراہم کرتا ہے جو</text>
  <text x="440" y="175" font-family="'Inter', sans-serif" font-size="11" fill="#334155">ریئل ٹائم کمپیوٹنگ اور کنکرنٹ API درخواستوں</text>
  <text x="440" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#334155">کے بوجھ کے مطابق کام کرتے ہیں۔</text>

  <rect x="440" y="225" width="275" height="1" fill="#e2e8f0"/>
  <text x="440" y="250" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#15803d">اصطلاحی تصدیق اور فارمیٹنگ:</text>
  <rect x="440" y="265" width="275" height="32" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="453" y="285" font-family="'Inter', sans-serif" font-size="9.5" fill="#15803d">• پیشہ ورانہ اصطلاحات کی مکمل مطابقت</text>

  <rect x="440" y="305" width="275" height="32" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="453" y="325" font-family="'Inter', sans-serif" font-size="9.5" fill="#15803d">• پبلشنگ کے لیے موزوں فونٹس اور لے آؤٹ</text>
</svg>
