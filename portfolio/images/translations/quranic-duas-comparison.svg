<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="urduBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="engBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Parity Badge Gradient -->
    <linearGradient id="parityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <line x1="0" y1="95" x2="1600" y2="95" stroke="#cbd5e1" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="840" x2="1600" y2="840" stroke="#cbd5e1" stroke-width="1" opacity="0.6"/>

  <!-- Top Showcase Header -->
  <text x="800" y="45" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">Selected Quranic Supplications (Duas from All 30 Paras): Side-by-Side Content Comparison</text>
  <text x="800" y="74" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#475569" text-anchor="middle" letter-spacing="0.2">Complete Word-by-Word Parity, Grammatical Alignment &amp; Theological Accuracy • Translated &amp; Formatted by Hammad Hassan</text>

  <!-- LEFT PANEL: Original Urdu Manuscript -->
  <g transform="translate(60, 105)">
    <!-- Document Card Container -->
    <rect x="0" y="25" width="690" height="700" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Top Header Ribbon -->
    <rect x="0" y="25" width="690" height="42" rx="14" fill="#f8fafc"/>
    <rect x="0" y="55" width="690" height="12" fill="#f8fafc"/>
    <line x1="0" y1="67" x2="690" y2="67" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Left Badge -->
    <rect x="25" y="0" width="360" height="34" rx="17" fill="url(#urduBadgeGrad)" filter="url(#badgeShadow)"/>
    <text x="205" y="22" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ORIGINAL URDU MANUSCRIPT (SURAH AL-FATIHAH)</text>

    <!-- Status Pill -->
    <rect x="540" y="32" width="125" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <circle cx="555" cy="45" r="4" fill="#2563eb"/>
    <text x="615" y="49" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">Source Pages</text>

    <!-- High-Definition Embedded Urdu Page -->
    <g clip-path="url(#leftClip)">
      <clipPath id="leftClip">
        <rect x="6" y="68" width="678" height="652" rx="10"/>
      </clipPath>
      <image href="quranic-duas-urdu-original.png" x="6" y="68" width="678" height="652" preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>

  <!-- CENTER DIVIDER & PARITY ACCENT -->
  <g transform="translate(800, 120)">
    <!-- Vertical Connecting Line -->
    <line x1="0" y1="30" x2="0" y2="690" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6" opacity="0.7"/>
    
    <!-- Floating Circular Parity Badge -->
    <circle cx="0" cy="360" r="32" fill="#ffffff" stroke="#0ea5e9" stroke-width="3" filter="url(#badgeShadow)"/>
    <text x="0" y="355" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#0284c7" text-anchor="middle">↔</text>
    <text x="0" y="372" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">100%</text>
    <text x="0" y="383" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#64748b" text-anchor="middle">PARITY</text>
  </g>

  <!-- RIGHT PANEL: English Translation & Typesetting -->
  <g transform="translate(850, 105)">
    <!-- Document Card Container -->
    <rect x="0" y="25" width="690" height="700" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Top Header Ribbon -->
    <rect x="0" y="25" width="690" height="42" rx="14" fill="#f0fdf4"/>
    <rect x="0" y="55" width="690" height="12" fill="#f0fdf4"/>
    <line x1="0" y1="67" x2="690" y2="67" stroke="#bbf7d0" stroke-width="1.5"/>

    <!-- Right Badge -->
    <rect x="25" y="0" width="410" height="34" rx="17" fill="url(#engBadgeGrad)" filter="url(#badgeShadow)"/>
    <text x="230" y="22" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ENGLISH TRANSLATION &amp; TYPESETTING (SURAH AL-FATIHAH)</text>

    <!-- Status Pill -->
    <rect x="540" y="32" width="125" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="555" cy="45" r="4" fill="#059669"/>
    <text x="615" y="49" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#065f46" text-anchor="middle">English Edition</text>

    <!-- High-Definition Embedded English Page -->
    <g clip-path="url(#rightClip)">
      <clipPath id="rightClip">
        <rect x="6" y="68" width="678" height="652" rx="10"/>
      </clipPath>
      <image href="quranic-duas-english-translation.png" x="6" y="68" width="678" height="652" preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>

  <!-- BOTTOM METRICS & PRODUCTION BAR -->
  <g transform="translate(800, 868)">
    <rect x="-650" y="-18" width="1300" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#badgeShadow)"/>
    
    <g transform="translate(-520, 4)">
      <circle cx="-10" cy="-4" r="7" fill="#10b981"/>
      <path d="M-13 -4 L-11 -2 L-7 -6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="5" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Canva Pro Editorial Geometry</text>
    </g>

    <g transform="translate(-230, 4)">
      <circle cx="-10" cy="-4" r="7" fill="#10b981"/>
      <path d="M-13 -4 L-11 -2 L-7 -6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="5" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Classical Arabic Lexicon Research</text>
    </g>

    <g transform="translate(70, 4)">
      <circle cx="-10" cy="-4" r="7" fill="#10b981"/>
      <path d="M-13 -4 L-11 -2 L-7 -6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="5" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Google Translate &amp; AI Terminology</text>
    </g>

    <g transform="translate(360, 4)">
      <circle cx="-10" cy="-4" r="7" fill="#10b981"/>
      <path d="M-13 -4 L-11 -2 L-7 -6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="5" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1e293b">MS Word Preflight &amp; 300 DPI KDP</text>
    </g>
  </g>
</svg>
