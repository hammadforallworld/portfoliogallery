<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sup-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18080c"/>
      <stop offset="50%" stop-color="#240c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sup-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="sup-isometric" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(244, 63, 94, 0.07)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(251, 146, 60, 0.2)"/>
    </pattern>
    <filter id="sup-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sup-bg)"/>
  <rect width="800" height="450" fill="url(#sup-isometric)"/>

  <!-- Glowing atmospheric orbs -->
  <circle cx="680" cy="110" r="160" fill="#f43f5e" opacity="0.12" filter="url(#sup-glow)"/>
  <circle cx="120" cy="380" r="130" fill="#ea580c" opacity="0.08" filter="url(#sup-glow)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="410" rx="16" fill="none" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1.5"/>

  <!-- Engineering & Physics Motif Emblem (Right side) -->
  <g transform="translate(560, 130)">
    <!-- Outer Gear/Ring structure -->
    <circle cx="100" cy="100" r="80" fill="#200d14" stroke="url(#sup-accent)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(251, 146, 60, 0.3)" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Atomic / Physics Orbits -->
    <ellipse cx="100" cy="100" rx="60" ry="24" fill="none" stroke="#f43f5e" stroke-width="2" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="100" rx="60" ry="24" fill="none" stroke="#fb923c" stroke-width="2" transform="rotate(-30 100 100)"/>
    <circle cx="100" cy="100" r="7" fill="#f43f5e"/>
    <circle cx="140" cy="78" r="4" fill="#fb923c"/>
    <circle cx="60" cy="122" r="4" fill="#fb923c"/>

    <!-- Math Integral & Sigma symbols floating -->
    <text x="100" y="215" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(251, 146, 60, 0.75)" text-anchor="middle" letter-spacing="2">f(x) dx • E = mc²</text>
  </g>

  <!-- Content Left Column -->
  <!-- Top Badge Pill -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#f43f5e"/>
    <text x="28" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fb7185" letter-spacing="1.5">INTERMEDIATE EDUCATION</text>
  </g>

  <!-- Institution Name -->
  <text x="60" y="125" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2">SUPERIOR COLLEGE TALAGANG</text>

  <!-- Degree Title -->
  <text x="60" y="165" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Faculty of Science (F.Sc)</text>
  <text x="60" y="202" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="url(#sup-accent)" letter-spacing="-0.5">Pre-Engineering Discipline</text>

  <!-- Timeline & Status Badges -->
  <g transform="translate(60, 235)">
    <rect x="0" y="0" width="124" height="28" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="62" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">2019 — 2021</text>

    <rect x="136" y="0" width="120" height="28" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)"/>
    <circle cx="148" cy="14" r="3.5" fill="#f43f5e"/>
    <text x="198" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">COMPLETED</text>
  </g>

  <!-- Specialization Pills -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="165" height="26" rx="6" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.2)"/>
    <text x="82" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#fda4af" text-anchor="middle">Calculus &amp; Mathematics</text>

    <rect x="175" y="0" width="155" height="26" rx="6" fill="rgba(251, 146, 60, 0.08)" stroke="rgba(251, 146, 60, 0.2)"/>
    <text x="252" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#fed7aa" text-anchor="middle">Physics &amp; Mechanics</text>

    <rect x="340" y="0" width="160" height="26" rx="6" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.2)"/>
    <text x="420" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#fda4af" text-anchor="middle">Analytical Modeling</text>
  </g>

  <!-- Bottom Info Bar -->
  <g transform="translate(60, 360)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">&gt; Board of Intermediate &amp; Secondary Education (BISE) | STEM Rigor</text>
  </g>
</svg>
