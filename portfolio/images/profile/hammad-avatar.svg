<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121222"/>
      <stop offset="50%" stop-color="#1a1836"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#655cf6"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#655cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#avatarBg)"/>
  <circle cx="200" cy="200" r="160" fill="url(#centerGlow)"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#purpleRing)" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- Programmer / Developer Icon Motif -->
  <circle cx="200" cy="150" r="50" fill="#1e1e34" stroke="#655cf6" stroke-width="3"/>
  <path d="M 120 310 C 120 235, 160 220, 200 220 C 240 220, 280 235, 280 310 Z" fill="#1e1e34" stroke="#655cf6" stroke-width="3"/>
  <!-- Code Symbol on Chest -->
  <rect x="175" y="245" width="50" height="26" rx="6" fill="#655cf6" opacity="0.95"/>
  <text x="200" y="263" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt; / &gt;</text>
  <!-- Modern Glasses / Tech accent -->
  <circle cx="185" cy="150" r="13" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="215" cy="150" r="13" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="198" y1="150" x2="202" y2="150" stroke="#ffffff" stroke-width="2.5"/>
</svg>
