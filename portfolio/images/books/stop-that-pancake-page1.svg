<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Page Background Gradient -->
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Kitchen Wall & Window -->
    <linearGradient id="kitchenTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <radialGradient id="pancakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <filter id="shadowPage" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Full Book Spread Background -->
  <rect width="1600" height="900" fill="#f8fafc"/>

  <!-- Left Page (x: 50 to 780, y: 30 to 870) -->
  <rect x="50" y="30" width="730" height="840" rx="8" fill="url(#p1Bg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Right Page (x: 820 to 1550, y: 30 to 870) -->
  <rect x="820" y="30" width="730" height="840" rx="8" fill="url(#p1Bg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Center Crease Shadow -->
  <rect x="780" y="30" width="40" height="840" fill="#e2e8f0" opacity="0.6"/>
  <line x1="800" y1="30" x2="800" y2="870" stroke="#cbd5e1" stroke-width="3"/>

  <!-- ========================================================================= -->
  <!-- LEFT PAGE: CHEF PIERRE IN HIS SUNNY KITCHEN -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 70)">
    <!-- Chapter Header Ribbon -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#f59e0b"/>
    <text x="110" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAGE 1 • CHAPTER 1</text>

    <!-- Story Headline -->
    <text x="0" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="34" font-weight="900" fill="#78350f">The Kitchen Escape!</text>

    <!-- Main Illustrated Kitchen Scene -->
    <g transform="translate(0, 120)">
      <!-- Kitchen Background Wall with checkered tiles -->
      <rect x="0" y="0" width="630" height="380" rx="16" fill="url(#kitchenTile)" stroke="#7dd3fc" stroke-width="3"/>
      <!-- Window with morning sun -->
      <rect x="360" y="30" width="220" height="220" rx="12" fill="#38bdf8" stroke="#ffffff" stroke-width="6"/>
      <circle cx="470" cy="140" r="45" fill="#fef08a"/>
      <!-- Window Panes -->
      <line x1="470" y1="30" x2="470" y2="250" stroke="#ffffff" stroke-width="6"/>
      <line x1="360" y1="140" x2="580" y2="140" stroke="#ffffff" stroke-width="6"/>

      <!-- Chef Pierre Character -->
      <g transform="translate(140, 90)">
        <!-- Chef Hat (Toque) -->
        <path d="M 50,-60 Q 30,-30 45,0 L 105,0 Q 120,-30 100,-60 Q 75,-90 50,-60 Z" fill="#ffffff" stroke="#78350f" stroke-width="3"/>
        <line x1="60" y1="-50" x2="60" y2="-10" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="75" y1="-60" x2="75" y2="-10" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="90" y1="-50" x2="90" y2="-10" stroke="#cbd5e1" stroke-width="2"/>
        <rect x="42" y="-12" width="66" height="15" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="2"/>

        <!-- Face -->
        <circle cx="75" cy="30" r="38" fill="#fed7aa" stroke="#78350f" stroke-width="3"/>
        <!-- Eyes shocked open -->
        <circle cx="62" cy="22" r="7" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <circle cx="62" cy="22" r="3.5" fill="#0f172a"/>
        <circle cx="88" cy="22" r="7" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <circle cx="88" cy="22" r="3.5" fill="#0f172a"/>
        <!-- Rosy Cheeks -->
        <circle cx="50" cy="38" r="8" fill="#fda4af" opacity="0.6"/>
        <circle cx="100" cy="38" r="8" fill="#fda4af" opacity="0.6"/>
        <!-- Big Curled French Mustache -->
        <path d="M 55,42 Q 75,55 95,42 Q 105,32 110,40 Q 100,52 75,50 Q 50,52 40,40 Q 45,32 55,42 Z" fill="#78350f"/>
        <!-- Mouth Open in Surprise -->
        <ellipse cx="75" cy="56" rx="8" ry="10" fill="#991b1b"/>

        <!-- Chef Body & Striped Scarf -->
        <path d="M 55,68 Q 75,80 95,68 L 105,78 L 45,78 Z" fill="#dc2626"/>
        <path d="M 40,80 L 110,80 L 125,230 L 25,230 Z" fill="#ffffff" stroke="#78350f" stroke-width="3"/>

        <!-- Pan in hand with flipping motion -->
        <line x1="110" y1="120" x2="190" y2="80" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
        <ellipse cx="230" cy="65" rx="50" ry="16" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
        <!-- Motion curve -->
        <path d="M 230,50 Q 260,-40 330,-60" stroke="#f59e0b" stroke-width="5" stroke-dasharray="8,6" fill="none"/>
      </g>
    </g>

    <!-- Story Text Below Scene (Large, Clean, Beginner Phonics & Easy Sight Words) -->
    <g transform="translate(10, 540)">
      <rect x="0" y="0" width="610" height="190" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadowPage)"/>
      <text x="30" y="50" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">One sunny morning, Chef Pierre woke up early.</text>
      <text x="30" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">He mixed flour, milk, and sweet golden honey.</text>
      <text x="30" y="130" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="26" font-weight="900" fill="#d97706">"I will bake the biggest pancake ever!"</text>
      <text x="30" y="165" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="bold" fill="#334155">He flipped the pan with all his might... <tspan fill="#dc2626">SWOOSH!</tspan></text>
    </g>

    <!-- Page Number -->
    <text x="315" y="770" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">Page 1</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PAGE: THE PANCAKE SPRINGS TO LIFE & FLIES OUT WINDOW -->
  <!-- ========================================================================= -->
  <g transform="translate(870, 70)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0284c7"/>
    <text x="110" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAGE 2 • THE LEAP</text>

    <!-- Story Headline -->
    <text x="0" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="34" font-weight="900" fill="#0369a1">"You Can't Eat Me!"</text>

    <!-- Main Illustrated Garden & Window Scene -->
    <g transform="translate(0, 120)">
      <!-- Outdoor Garden View through window -->
      <rect x="0" y="0" width="630" height="380" rx="16" fill="#86efac" stroke="#4ade80" stroke-width="3"/>
      <!-- Soft blue sky and garden hill -->
      <path d="M 0,0 L 630,0 L 630,220 Q 300,160 0,220 Z" fill="#7dd3fc"/>
      <!-- Colorful Flowers in Grass -->
      <circle cx="80" cy="320" r="14" fill="#f43f5e"/>
      <circle cx="80" cy="320" r="5" fill="#fef08a"/>
      <circle cx="180" cy="340" r="12" fill="#a855f7"/>
      <circle cx="180" cy="340" r="4" fill="#fef08a"/>
      <circle cx="520" cy="310" r="16" fill="#f97316"/>
      <circle cx="520" cy="310" r="6" fill="#fef08a"/>

      <!-- Open Window Sill -->
      <rect x="30" y="50" width="200" height="260" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="6"/>

      <!-- THE SMILING RUNAWAY PANCAKE IN MID-AIR JUMP -->
      <g transform="translate(360, 160)">
        <!-- Speed Trails -->
        <path d="M -160,-20 Q -90,-15 -40,-10" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M -180,20 Q -90,25 -50,20" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>

        <!-- Pancake Body -->
        <ellipse cx="0" cy="0" rx="100" ry="85" fill="url(#pancakeGlow)" stroke="#78350f" stroke-width="5"/>
        <!-- Butter on Top -->
        <rect x="-24" y="-65" width="48" height="32" rx="6" fill="#fef08a" stroke="#d97706" stroke-width="3"/>

        <!-- Cartoon Eyes (Winking playfully) -->
        <!-- Left Eye (Open and joyful) -->
        <circle cx="-35" cy="-12" r="22" fill="#ffffff" stroke="#78350f" stroke-width="3"/>
        <circle cx="-30" cy="-12" r="12" fill="#0f172a"/>
        <circle cx="-26" cy="-16" r="4" fill="#ffffff"/>
        <!-- Right Eye (Playful Wink) -->
        <path d="M 20,-12 Q 35,-26 50,-12" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>

        <!-- Wide Open Giggling Smile -->
        <path d="M -30,25 Q 0,65 35,25 Z" fill="#dc2626" stroke="#78350f" stroke-width="4"/>
        <path d="M -12,42 Q 0,52 16,42 Z" fill="#fda4af"/>

        <!-- Red Running Sneakers -->
        <g transform="translate(-40, 75)">
          <path d="M 0,0 L 25,25 L 45,20 L 20,-5 Z" fill="#ef4444" stroke="#78350f" stroke-width="3"/>
          <rect x="25" y="16" width="28" height="12" rx="5" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        </g>
        <g transform="translate(30, 65)">
          <path d="M 0,0 L 30,22 L 50,15 L 20,-5 Z" fill="#ef4444" stroke="#78350f" stroke-width="3"/>
          <rect x="30" y="12" width="28" height="12" rx="5" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        </g>

        <!-- Speech Bubble from Pancake -->
        <g transform="translate(40, -110)">
          <rect x="-60" y="-15" width="210" height="55" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="3" filter="url(#shadowPage)"/>
          <polygon points="10,40 -5,55 25,40" fill="#ffffff"/>
          <text x="45" y="12" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">"Catch me if you can!"</text>
          <text x="45" y="32" font-family="'Comic Sans MS', cursive" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="middle">I have red sneakers!</text>
        </g>
      </g>
    </g>

    <!-- Story Text Below Scene -->
    <g transform="translate(10, 540)">
      <rect x="0" y="0" width="610" height="190" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2" filter="url(#shadowPage)"/>
      <text x="30" y="50" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="26" font-weight="900" fill="#dc2626">POP! The pancake sprang to life!</text>
      <text x="30" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Two bright eyes opened. A happy smile appeared.</text>
      <text x="30" y="130" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0284c7">"You cannot eat me!" giggled the pancake.</text>
      <text x="30" y="165" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="bold" fill="#78350f">It hopped off the pan and zoomed right out the window!</text>
    </g>

    <!-- Page Number -->
    <text x="315" y="770" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">Page 2</text>
  </g>
</svg>
