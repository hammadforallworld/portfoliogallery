<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Park Meadow Gradient -->
    <linearGradient id="parkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <!-- Path Dirt Gradient -->
    <linearGradient id="pathDirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbd38d"/>
    </linearGradient>

    <!-- Pancake Gradient -->
    <radialGradient id="pancakeBody" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Bear Fur Gradient -->
    <linearGradient id="bearFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Sneaker Red Gradient -->
    <linearGradient id="sneakerRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <filter id="shadowPage" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Full Book Spread Background -->
  <rect width="1600" height="900" fill="#f8fafc"/>

  <!-- Left Page (x: 50 to 780, y: 30 to 870) -->
  <rect x="50" y="30" width="730" height="840" rx="8" fill="url(#parkBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Right Page (x: 820 to 1550, y: 30 to 870) -->
  <rect x="820" y="30" width="730" height="840" rx="8" fill="url(#parkBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Center Crease Shadow -->
  <rect x="780" y="30" width="40" height="840" fill="#cbd5e1" opacity="0.6"/>
  <line x1="800" y1="30" x2="800" y2="870" stroke="#94a3b8" stroke-width="3"/>

  <!-- ========================================================================= -->
  <!-- LEFT PAGE: FULL SPEED PURSUIT IN THE MEADOW -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 70)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="230" height="38" rx="19" fill="#ea580c"/>
    <text x="115" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAGE 7 • FULL SPEED!</text>

    <!-- Story Headline -->
    <text x="0" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="34" font-weight="900" fill="#9a3412">"Stop That Golden Pancake!"</text>

    <!-- Meadow Chase Illustration Area -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="630" height="380" rx="16" fill="#fef9c3" stroke="#fde047" stroke-width="3"/>

      <!-- Distant Hills & Shady Oak Trees -->
      <path d="M 0,220 Q 200,160 400,210 T 630,190 L 630,380 L 0,380 Z" fill="#86efac" opacity="0.7"/>
      <!-- Shady Oak Tree in background -->
      <circle cx="80" cy="110" r="45" fill="#15803d" opacity="0.85"/>
      <circle cx="120" cy="95" r="50" fill="#16a34a" opacity="0.85"/>
      <circle cx="150" cy="115" r="40" fill="#22c55e" opacity="0.85"/>
      <rect x="105" y="140" width="24" height="90" fill="#78350f" rx="4"/>

      <!-- Winding Meadow Path -->
      <path d="M 0,330 Q 300,260 630,320 L 630,380 L 0,380 Z" fill="url(#pathDirt)"/>

      <!-- CHEF PIERRE SPRINTING WITH ROLLING PIN -->
      <g transform="translate(40, 150)">
        <!-- Chef Hat -->
        <path d="M 10,-35 Q -5,-15 5,5 L 45,5 Q 55,-15 40,-35 Q 25,-55 10,-35 Z" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <rect x="4" y="-3" width="42" height="10" rx="2" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
        <!-- Face -->
        <circle cx="25" cy="20" r="22" fill="#fed7aa" stroke="#78350f" stroke-width="2"/>
        <circle cx="18" cy="16" r="4" fill="#0f172a"/>
        <circle cx="32" cy="16" r="4" fill="#0f172a"/>
        <!-- French Mustache -->
        <path d="M 12,28 Q 25,35 38,28 Q 44,22 47,26 Q 40,34 25,32 Q 10,34 3,26 Q 6,22 12,28 Z" fill="#78350f"/>
        <!-- Chef Coat -->
        <path d="M 10,42 L 40,42 L 50,110 L 0,110 Z" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <line x1="25" y1="42" x2="25" y2="110" stroke="#cbd5e1" stroke-width="2"/>
        <!-- Rolling Pin Waved in Hand -->
        <line x1="38" y1="60" x2="70" y2="25" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
        <rect x="65" y="10" width="55" height="14" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2" transform="rotate(-30, 65, 10)"/>
        <!-- Running Legs -->
        <line x1="15" y1="110" x2="-5" y2="155" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
        <line x1="35" y1="110" x2="55" y2="150" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- BARNABY BEAR SPRINTING (With straw in fur) -->
      <g transform="translate(175, 160)">
        <!-- Bear Body & Overalls -->
        <ellipse cx="40" cy="55" rx="36" ry="42" fill="url(#bearFur)" stroke="#451a03" stroke-width="2.5"/>
        <path d="M 15,45 L 65,45 L 70,85 L 10,85 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
        <!-- Head -->
        <circle cx="40" cy="0" r="28" fill="url(#bearFur)" stroke="#451a03" stroke-width="2.5"/>
        <circle cx="20" cy="-22" r="10" fill="url(#bearFur)" stroke="#451a03" stroke-width="2"/>
        <circle cx="60" cy="-22" r="10" fill="url(#bearFur)" stroke="#451a03" stroke-width="2"/>
        <!-- Snout -->
        <ellipse cx="40" cy="6" rx="14" ry="10" fill="#fde68a"/>
        <ellipse cx="40" cy="2" rx="6" ry="4" fill="#1e293b"/>
        <!-- Eyes & Eyebrows -->
        <circle cx="32" cy="-6" r="4" fill="#1e293b"/>
        <circle cx="48" cy="-6" r="4" fill="#1e293b"/>
        <!-- Hay straw in ear -->
        <line x1="15" y1="-30" x2="5" y2="-45" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
        <line x1="22" y1="-28" x2="28" y2="-42" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
        <!-- Legs running -->
        <line x1="25" y1="95" x2="10" y2="145" stroke="url(#bearFur)" stroke-width="12" stroke-linecap="round"/>
        <line x1="55" y1="95" x2="75" y2="140" stroke="url(#bearFur)" stroke-width="12" stroke-linecap="round"/>
      </g>

      <!-- BENNY BUNNY & FELIX FOX -->
      <g transform="translate(300, 230)">
        <!-- Benny Bunny -->
        <ellipse cx="20" cy="20" rx="16" ry="20" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
        <circle cx="20" cy="0" r="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
        <!-- Long floppy ears -->
        <ellipse cx="14" cy="-20" rx="5" ry="15" fill="#e2e8f0" stroke="#64748b" stroke-width="2" transform="rotate(-15, 14, -20)"/>
        <ellipse cx="26" cy="-20" rx="5" ry="15" fill="#e2e8f0" stroke="#64748b" stroke-width="2" transform="rotate(15, 26, -20)"/>
        <!-- Eye & Pink Nose -->
        <circle cx="24" cy="-2" r="2.5" fill="#0f172a"/>
        <circle cx="28" cy="2" r="2" fill="#f43f5e"/>

        <!-- Felix Fox Bounding Ahead -->
        <g transform="translate(60, -20)">
          <ellipse cx="25" cy="25" rx="22" ry="16" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
          <polygon points="40,25 55,20 45,35" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
          <!-- Fox Ears -->
          <polygon points="35,12 40,-2 48,15" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
          <polygon points="38,10 40,2 44,12" fill="#ffffff"/>
          <!-- Bushy Tail -->
          <path d="M 5,30 Q -25,20 -15,5 Q 5,10 5,30 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
          <polygon points="-20,8 -15,5 -10,12" fill="#ffffff"/>
        </g>
      </g>

      <!-- THE PANCAKE ZOOMING AHEAD IN RED SNEAKERS -->
      <g transform="translate(510, 250)">
        <ellipse cx="0" cy="0" rx="65" ry="50" fill="url(#pancakeBody)" stroke="#78350f" stroke-width="4"/>
        <ellipse cx="0" cy="-6" rx="50" ry="34" fill="#fef08a" opacity="0.4"/>
        <!-- Smiling Eyes looking back -->
        <circle cx="-16" cy="-8" r="12" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <circle cx="-20" cy="-8" r="6" fill="#0f172a"/>
        <circle cx="20" cy="-8" r="12" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <circle cx="16" cy="-8" r="6" fill="#0f172a"/>
        <path d="M -15,12 Q 2,30 20,12" stroke="#78350f" stroke-width="3" fill="none"/>
        <!-- Red Sneakers -->
        <g transform="translate(-25, 42)">
          <path d="M 0,0 L 26,0 L 32,15 L -6,15 Z" fill="url(#sneakerRed)" stroke="#78350f" stroke-width="2"/>
          <rect x="-8" y="15" width="40" height="6" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
        </g>
        <g transform="translate(18, 38) rotate(-15)">
          <path d="M 0,0 L 26,0 L 32,15 L -6,15 Z" fill="url(#sneakerRed)" stroke="#78350f" stroke-width="2"/>
          <rect x="-8" y="15" width="40" height="6" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
        </g>
        <!-- Speed Trails -->
        <line x1="-70" y1="-10" x2="-110" y2="-10" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="-65" y1="15" x2="-120" y2="15" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Story Text Below Scene (Large, Clean Phonics) -->
    <g transform="translate(10, 540)">
      <rect x="0" y="0" width="610" height="190" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadowPage)"/>
      <text x="30" y="48" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="900" fill="#ea580c">"AFTER THAT PANCAKE!" shouted Chef Pierre.</text>
      <text x="30" y="86" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Barnaby Bear ran fast, shaking the grassy ground!</text>
      <text x="30" y="125" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="bold" fill="#0284c7">Benny Bunny hopped high. Felix Fox zoomed like a rocket!</text>
      <text x="30" y="162" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="900" fill="#b91c1c">"Get ready to DIVE!" cried Pierre. "ONE... TWO... THREE!"</text>
    </g>

    <!-- Page Number -->
    <text x="315" y="770" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">Page 7</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PAGE: THE HILARIOUS ANIMAL DOGPILE! -->
  <!-- ========================================================================= -->
  <g transform="translate(870, 70)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="230" height="38" rx="19" fill="#dc2626"/>
    <text x="115" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAGE 8 • THE BIG DOGPILE!</text>

    <!-- Story Headline -->
    <text x="0" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="34" font-weight="900" fill="#b91c1c">CRASH! BUMP! GIGGLE!</text>

    <!-- Dogpile Crash Scene Area -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="630" height="380" rx="16" fill="#fef2f2" stroke="#f87171" stroke-width="3"/>

      <!-- Grassy Lawn Background -->
      <path d="M 0,260 Q 300,220 630,260 L 630,380 L 0,380 Z" fill="#bbf7d0"/>

      <!-- BIG COMIC CRASH BURST CLOUD -->
      <g transform="translate(260, 200)">
        <!-- Dust Puff Cloud Background -->
        <path d="M -180,-40 Q -210,-90 -140,-110 Q -90,-160 -10,-130 Q 70,-165 130,-115 Q 200,-100 180,-30 Q 220,50 150,90 Q 60,140 -40,110 Q -150,130 -170,50 Z" fill="#fef08a" stroke="#f59e0b" stroke-width="4"/>

        <!-- Animated Stars & Giggles around pile -->
        <polygon points="-120,-120 -110,-100 -90,-105 -105,-90 -100,-70 -115,-80 -130,-70 -125,-90 -140,-105 -120,-100" fill="#facc15" stroke="#ca8a04"/>
        <polygon points="120,-130 130,-110 150,-115 135,-100 140,-80 125,-90 110,-80 115,-100 100,-115 120,-110" fill="#facc15" stroke="#ca8a04"/>
        <polygon points="-20,-155 -10,-135 10,-140 -5,-125 0,-105 -15,-115 -30,-105 -25,-125 -40,-140 -20,-135" fill="#facc15" stroke="#ca8a04"/>

        <!-- THE FLUFFY MIXED-UP HEAP OF CHARACTERS -->
        <!-- Barnaby Bear's big round back & overalls -->
        <ellipse cx="-10" cy="20" rx="90" ry="75" fill="url(#bearFur)" stroke="#451a03" stroke-width="4"/>
        <ellipse cx="-10" cy="40" rx="70" ry="45" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>

        <!-- Bear Paws sticking up in confusion -->
        <ellipse cx="-90" cy="-30" rx="22" ry="35" fill="url(#bearFur)" stroke="#451a03" stroke-width="3" transform="rotate(-30, -90, -30)"/>
        <ellipse cx="70" cy="-30" rx="22" ry="35" fill="url(#bearFur)" stroke="#451a03" stroke-width="3" transform="rotate(30, 70, -30)"/>

        <!-- Chef Pierre upside down under the bear -->
        <!-- Pierre's legs sticking out left -->
        <line x1="-120" y1="40" x2="-170" y2="20" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
        <rect x="-195" y="10" width="30" height="18" rx="5" fill="#000000"/>
        <!-- Chef Hat landed right on Bear's bottom/back -->
        <path d="M -20,-75 Q -40,-50 -25,-25 L 25,-25 Q 40,-50 20,-75 Q 0,-95 -20,-75 Z" fill="#ffffff" stroke="#78350f" stroke-width="3"/>
        <rect x="-27" y="-28" width="54" height="12" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="2"/>

        <!-- Bunny Long Ears poking out -->
        <ellipse cx="60" cy="40" rx="8" ry="30" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5" transform="rotate(45, 60, 40)"/>
        <ellipse cx="80" cy="55" rx="8" ry="30" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5" transform="rotate(65, 80, 55)"/>

        <!-- Fox Bushy Tail sticking straight up like a flagpole -->
        <path d="M 0,-40 Q 20,-110 0,-140 Q -15,-110 0,-40 Z" fill="#ea580c" stroke="#9a3412" stroke-width="3"/>
        <polygon points="-8,-120 0,-140 8,-120" fill="#ffffff"/>

        <!-- COMIC CRASH SOUND EFFECT BADGE -->
        <g transform="translate(-150, -90)">
          <polygon points="0,0 25,-25 55,-10 85,-35 110,-5 140,-25 130,20 160,50 120,60 140,90 90,80 70,110 50,80 10,90 20,50 -20,40" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
          <text x="70" y="45" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">CRASH!</text>
        </g>
      </g>

      <!-- PANCAKE SLIDING SMOOTHLY OUT FROM THE PILE (BOTTOM RIGHT) -->
      <g transform="translate(530, 270)">
        <ellipse cx="0" cy="0" rx="65" ry="50" fill="url(#pancakeBody)" stroke="#78350f" stroke-width="4"/>
        <ellipse cx="0" cy="-6" rx="50" ry="34" fill="#fef08a" opacity="0.4"/>
        <!-- Happy Giggling Eyes -->
        <path d="M -22,-6 Q -14,-16 -6,-6" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 6,-6 Q 14,-16 22,-6" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- Wide open laughing smile -->
        <path d="M -16,8 Q 0,30 16,8 Z" fill="#dc2626" stroke="#78350f" stroke-width="3"/>
        <!-- Red Sneakers sprinting toward picnic hill -->
        <g transform="translate(-20, 42)">
          <path d="M 0,0 L 26,0 L 32,15 L -6,15 Z" fill="url(#sneakerRed)" stroke="#78350f" stroke-width="2"/>
          <rect x="-8" y="15" width="40" height="6" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
        </g>
        <g transform="translate(18, 36) rotate(-20)">
          <path d="M 0,0 L 26,0 L 32,15 L -6,15 Z" fill="url(#sneakerRed)" stroke="#78350f" stroke-width="2"/>
          <rect x="-8" y="15" width="40" height="6" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
        </g>
        <!-- Speech Bubble: Tee-hee! -->
        <g transform="translate(-25, -60)">
          <rect x="0" y="0" width="90" height="32" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
          <text x="45" y="21" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">Tee-hee!</text>
        </g>
      </g>
    </g>

    <!-- Story Text Below Scene (Large, Clean Phonics) -->
    <g transform="translate(10, 540)">
      <rect x="0" y="0" width="610" height="190" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="2" filter="url(#shadowPage)"/>
      <text x="30" y="48" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="900" fill="#dc2626">CRASH! BUMP! GIGGLE! OUCH!</text>
      <text x="30" y="86" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">All the friends piled into one giant, fluffy animal heap!</text>
      <text x="30" y="125" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="bold" fill="#78350f">Chef Pierre's hat landed on Barnaby's nose! Everyone giggled!</text>
      <text x="30" y="162" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="900" fill="#15803d">But the clever pancake rolled right out the other side!</text>
    </g>

    <!-- Page Number -->
    <text x="315" y="770" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">Page 8</text>
  </g>
</svg>
