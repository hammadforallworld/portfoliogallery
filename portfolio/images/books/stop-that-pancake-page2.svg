<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Farm Background Gradient -->
    <linearGradient id="farmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <!-- Haystack Texture -->
    <linearGradient id="hayGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <radialGradient id="pancakeBody" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <filter id="shadowPage" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Full Book Spread Background -->
  <rect width="1600" height="900" fill="#f8fafc"/>

  <!-- Left Page (x: 50 to 780) -->
  <rect x="50" y="30" width="730" height="840" rx="8" fill="url(#farmBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Right Page (x: 820 to 1550) -->
  <rect x="820" y="30" width="730" height="840" rx="8" fill="url(#farmBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Center Crease Shadow -->
  <rect x="780" y="30" width="40" height="840" fill="#e2e8f0" opacity="0.6"/>
  <line x1="800" y1="30" x2="800" y2="870" stroke="#cbd5e1" stroke-width="3"/>

  <!-- ========================================================================= -->
  <!-- LEFT PAGE: CLUCKY THE HEN & BARNYARD SPRINT -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 70)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#ea580c"/>
    <text x="110" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAGE 3 • THE FARMYARD</text>

    <!-- Story Headline -->
    <text x="0" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="34" font-weight="900" fill="#9a3412">"Watch Out for My Eggs!"</text>

    <!-- Farmyard Scene -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="630" height="380" rx="16" fill="#fef9c3" stroke="#fde047" stroke-width="3"/>

      <!-- Red Barn in Background -->
      <polygon points="400,100 520,30 640,100" fill="#dc2626"/>
      <rect x="420" y="100" width="200" height="150" fill="#b91c1c"/>
      <rect x="470" y="150" width="60" height="100" fill="#ffffff"/>
      <!-- Barn X Door -->
      <line x1="470" y1="150" x2="530" y2="250" stroke="#dc2626" stroke-width="4"/>
      <line x1="530" y1="150" x2="470" y2="250" stroke="#dc2626" stroke-width="4"/>

      <!-- Wooden Fence -->
      <line x1="0" y1="260" x2="630" y2="260" stroke="#b45309" stroke-width="8"/>
      <line x1="0" y1="290" x2="630" y2="290" stroke="#b45309" stroke-width="8"/>
      <rect x="60" y="240" width="16" height="80" rx="3" fill="#d97706"/>
      <rect x="200" y="240" width="16" height="80" rx="3" fill="#d97706"/>
      <rect x="340" y="240" width="16" height="80" rx="3" fill="#d97706"/>

      <!-- PANCAKE ZOOMING BY -->
      <g transform="translate(180, 260)">
        <ellipse cx="0" cy="0" rx="75" ry="60" fill="url(#pancakeBody)" stroke="#78350f" stroke-width="4"/>
        <!-- Eyes & Smile -->
        <circle cx="-25" cy="-8" r="16" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <circle cx="-20" cy="-8" r="8" fill="#0f172a"/>
        <circle cx="25" cy="-8" r="16" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
        <circle cx="20" cy="-8" r="8" fill="#0f172a"/>
        <path d="M -18,18 Q 0,42 18,18 Z" fill="#dc2626" stroke="#78350f" stroke-width="3"/>
        <!-- Dust Clouds -->
        <circle cx="-90" cy="20" r="18" fill="#fde68a" opacity="0.8"/>
        <circle cx="-120" cy="30" r="12" fill="#fde68a" opacity="0.6"/>
      </g>

      <!-- CLUCKY THE HEN (Wings flapping, feathers flying comically) -->
      <g transform="translate(420, 200)">
        <!-- Feathers flying -->
        <ellipse cx="-40" cy="-40" rx="8" ry="16" fill="#ffffff" stroke="#cbd5e1" transform="rotate(-30)"/>
        <ellipse cx="60" cy="-30" rx="8" ry="16" fill="#ffffff" stroke="#cbd5e1" transform="rotate(40)"/>
        <ellipse cx="0" cy="-60" rx="6" ry="14" fill="#ffffff" stroke="#cbd5e1"/>

        <!-- Hen Body -->
        <ellipse cx="10" cy="40" rx="42" ry="36" fill="#ffffff" stroke="#78350f" stroke-width="3"/>
        <!-- Head -->
        <circle cx="-15" cy="10" r="24" fill="#ffffff" stroke="#78350f" stroke-width="3"/>
        <!-- Red Comb -->
        <path d="M -30,-5 Q -25,-25 -15,-10 Q -5,-25 5,-5 Z" fill="#ef4444"/>
        <!-- Yellow Beak -->
        <polygon points="-40,10 -30,4 -30,16" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
        <!-- Eye -->
        <circle cx="-20" cy="8" r="5" fill="#0f172a"/>
        <!-- Flapping Wings -->
        <ellipse cx="40" cy="25" rx="30" ry="18" fill="#f1f5f9" stroke="#78350f" stroke-width="3" transform="rotate(25)"/>
        <!-- Nest with 3 Speckled Eggs -->
        <ellipse cx="10" cy="85" rx="45" ry="14" fill="#ca8a04"/>
        <circle cx="-10" cy="80" r="10" fill="#fef3c7" stroke="#b45309"/>
        <circle cx="10" cy="78" r="10" fill="#fef3c7" stroke="#b45309"/>
        <circle cx="30" cy="80" r="10" fill="#fef3c7" stroke="#b45309"/>
      </g>
    </g>

    <!-- Story Text Below Scene -->
    <g transform="translate(10, 540)">
      <rect x="0" y="0" width="610" height="190" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadowPage)"/>
      <text x="30" y="50" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Down the farm path rolled the pancake!</text>
      <text x="30" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a"><tspan fill="#dc2626">ZOOM! ZOOM! ZOOM!</tspan> went its tiny red sneakers.</text>
      <text x="30" y="130" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#ea580c">Clucky the Hen flapped her wings wildly!</text>
      <text x="30" y="165" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="900" fill="#78350f">"BRAWK! Watch out for my warm eggs!" she squawked.</text>
    </g>

    <!-- Page Number -->
    <text x="315" y="770" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">Page 3</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PAGE: BARNABY BEAR AND THE HAYSTACK KER-PLOP! -->
  <!-- ========================================================================= -->
  <g transform="translate(870, 70)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#16a34a"/>
    <text x="110" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAGE 4 • KER-PLOP!</text>

    <!-- Story Headline -->
    <text x="0" y="90" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="34" font-weight="900" fill="#15803d">Barnaby Bear's Big Splash!</text>

    <!-- Haystack & Bear Crash Scene -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="630" height="380" rx="16" fill="#ecfccb" stroke="#a3e635" stroke-width="3"/>

      <!-- Big Giant Haystack on Left -->
      <path d="M 60,360 Q 90,80 260,80 Q 420,80 440,360 Z" fill="url(#hayGradient)" stroke="#b45309" stroke-width="4"/>
      <!-- Straw needles flying out -->
      <line x1="160" y1="120" x2="130" y2="90" stroke="#fef08a" stroke-width="4"/>
      <line x1="320" y1="140" x2="360" y2="100" stroke="#fef08a" stroke-width="4"/>
      <line x1="280" y1="60" x2="300" y2="30" stroke="#fef08a" stroke-width="4"/>

      <!-- BARNABY BEAR STUCK HEAD-FIRST IN HAYSTACK -->
      <!-- Overalls Body sticking out upside down -->
      <ellipse cx="250" cy="220" rx="60" ry="70" fill="#2563eb" stroke="#1e3a8a" stroke-width="4"/>
      <!-- Bear Legs in Air -->
      <ellipse cx="205" cy="130" rx="22" ry="40" fill="#78350f" stroke="#451a03" stroke-width="4" transform="rotate(-15, 205, 130)"/>
      <circle cx="200" cy="90" r="20" fill="#92400e" stroke="#451a03" stroke-width="3"/>
      
      <ellipse cx="295" cy="130" rx="22" ry="40" fill="#78350f" stroke="#451a03" stroke-width="4" transform="rotate(15, 295, 130)"/>
      <circle cx="300" cy="90" r="20" fill="#92400e" stroke="#451a03" stroke-width="3"/>

      <!-- Bear Tail wiggling -->
      <circle cx="250" cy="285" r="18" fill="#78350f"/>

      <!-- Slipped Pumpkin with Splat -->
      <ellipse cx="490" cy="310" rx="45" ry="30" fill="#ea580c" stroke="#9a3412" stroke-width="3"/>
      <path d="M 490,280 L 495,265" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>

      <!-- Butterfly Net on Ground -->
      <circle cx="480" cy="180" rx="40" ry="30" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4"/>
      <line x1="480" y1="210" x2="560" y2="290" stroke="#78350f" stroke-width="6"/>

      <!-- Big Comedic Sound Effect Bubble -->
      <g transform="translate(140, 160)">
        <polygon points="0,0 20,-30 50,-10 80,-40 100,-10 140,-30 130,20 160,50 120,60 140,90 90,80 70,110 50,80 10,90 20,50 -20,40" fill="#fef08a" stroke="#dc2626" stroke-width="3"/>
        <text x="70" y="45" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#dc2626" text-anchor="middle">KER-PLOP!</text>
      </g>
    </g>

    <!-- Story Text Below Scene -->
    <g transform="translate(10, 540)">
      <rect x="0" y="0" width="610" height="190" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#shadowPage)"/>
      <text x="30" y="48" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Barnaby Bear stepped out with his butterfly net.</text>
      <text x="30" y="86" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="24" font-weight="900" fill="#ea580c">"STOP! You smell sweet like honey syrup!"</text>
      <text x="30" y="125" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">He took a giant leap—<tspan fill="#dc2626">WHOOPS!</tspan> He slipped on a round pumpkin!</text>
      <text x="30" y="162" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="22" font-weight="bold" fill="#15803d">Head-first into the soft hay went Barnaby! His legs wiggled!</text>
    </g>

    <!-- Page Number -->
    <text x="315" y="770" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">Page 4</text>
  </g>
</svg>
