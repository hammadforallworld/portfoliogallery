<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="arcGradFree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="digiYellowFree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Clean Off-White Background with Subtle Grid Pattern -->
  <rect width="1200" height="800" fill="#fcfcfd"/>
  
  <g opacity="0.15" fill="#64748b">
    <circle cx="200" cy="180" r="3"/><circle cx="250" cy="180" r="3"/><circle cx="300" cy="180" r="3"/>
    <circle cx="200" cy="220" r="3"/><circle cx="250" cy="220" r="3"/><circle cx="300" cy="220" r="3"/>
    <circle cx="900" cy="180" r="3"/><circle cx="950" cy="180" r="3"/><circle cx="1000" cy="180" r="3"/>
    <circle cx="900" cy="220" r="3"/><circle cx="950" cy="220" r="3"/><circle cx="1000" cy="220" r="3"/>
  </g>

  <!-- ================= TOP HEADER LOGO ROW ================= -->
  <!-- Top Left: Ministry of Information Technology & Telecom, Pakistan -->
  <g transform="translate(60, 30)">
    <circle cx="25" cy="25" r="22" fill="#047857" opacity="0.12"/>
    <path d="M 25 10 A 15 15 0 0 0 25 40 A 12 12 0 0 1 25 16 Z" fill="#047857"/>
    <polygon points="28,21 30,27 36,27 31,31 33,37 28,33 23,37 25,31 20,27 26,27" fill="#047857" transform="scale(0.55) translate(22, 10)"/>
    <text x="60" y="20" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Ministry of Information</text>
    <text x="60" y="34" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#047857">Technology &amp; Telecom</text>
    <text x="60" y="46" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#64748b">Government of Pakistan</text>
  </g>

  <!-- Top Center: DigiSkills.pk Logo -->
  <g transform="translate(490, 30)">
    <path d="M 0 10 L 22 0 L 32 10 L 10 20 Z" fill="url(#digiYellowFree)"/>
    <path d="M 12 18 L 34 8 L 44 18 L 22 28 Z" fill="#f59e0b"/>
    <text x="50" y="25" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#1e293b" letter-spacing="-0.5">Digi<tspan fill="#f59e0b">Skills</tspan><tspan font-size="18">.pk</tspan></text>
    <rect x="52" y="32" width="135" height="12" rx="2" fill="#334155"/>
    <text x="120" y="41" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Sara Jahan Hamara</text>
  </g>

  <!-- Top Right: Ignite Logo -->
  <g transform="translate(970, 30)">
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#334155">Ign<tspan fill="#ea580c">i</tspan>te</text>
    <text x="0" y="42" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="0.8">NATIONAL TECHNOLOGY FUND</text>
  </g>

  <!-- ================= CENTRAL ILLUSTRATIVE TECH COMPASS ARC ================= -->
  <g transform="translate(600, 370)">
    <circle cx="0" cy="0" r="240" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Decorative Compass Arc Banner -->
    <path d="M -220 -30 A 225 225 0 0 1 220 -30" fill="none" stroke="url(#arcGradFree)" stroke-width="32" stroke-linecap="round"/>
    
    <path d="M -170 -20 A 175 175 0 0 1 170 -20" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="14,10"/>

    <g transform="translate(-250, -40)" fill="#94a3b8">
      <circle cx="0" cy="0" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <g transform="translate(250, -40)" fill="#94a3b8">
      <circle cx="0" cy="0" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- Center Document Title: TRAINING CERTIFICATE -->
    <text x="0" y="-30" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">TRAINING</text>
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="#0284c7" text-anchor="middle" letter-spacing="1">CERTIFICATE</text>
  </g>

  <!-- ================= RECIPIENT & COURSE DETAILS ================= -->
  <text x="600" y="525" font-family="'Inter', sans-serif" font-size="38" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">HAMMAD HASSAN</text>

  <!-- Training description statement -->
  <text x="600" y="565" font-family="'Inter', sans-serif" font-size="16.5" font-weight="500" fill="#334155" text-anchor="middle">
    has completed the training in <tspan font-weight="800" fill="#0f172a">FREELANCING</tspan> course under DigiSkills Training Program
  </text>
  
  <!-- Batch info -->
  <text x="600" y="595" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#0284c7" text-anchor="middle">
    DSTP2.0-Batch-08 Jul 2024-Oct 2024
  </text>

  <!-- ================= BOTTOM SIGNATORIES ================= -->
  <g transform="translate(180, 675)">
    <text x="-40" y="-20" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#1e3a8a">VU</text>
    <text x="-40" y="-8" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#475569">Virtual University</text>
    <path d="M 60 -24 C 85 -45, 105 -15, 130 -30 C 145 -40, 165 -15, 190 -25" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50" y1="-8" x2="200" y2="-8" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="10" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Irshad Saleem</text>
    <text x="125" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Rector, Virtual University</text>
  </g>

  <g transform="translate(860, 675)">
    <path d="M -30 -22 C -10 -45, 15 -10, 35 -30 C 50 -40, 75 -20, 95 -25" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-40" y1="-8" x2="110" y2="-8" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="35" y="10" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">CEO, Ignite</text>
    <text x="35" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Ignite National Technology Fund</text>
  </g>

  <!-- ================= BOTTOM VERIFICATION FOOTER BAR ================= -->
  <g transform="translate(0, 748)">
    <rect width="1200" height="52" fill="#ffffff"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#f97316" stroke-width="3"/>
    
    <text x="60" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#475569">Issue Date : 24/10/2024</text>

    <text x="600" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">
      This document may be verified online at: <tspan font-weight="700" fill="#0284c7">https://digiskills.pk/verify</tspan>
    </text>

    <text x="1140" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">
      Certificate ID: <tspan font-family="'Courier New', monospace" font-weight="800">55P3XMEMK</tspan>
    </text>
  </g>
</svg>
