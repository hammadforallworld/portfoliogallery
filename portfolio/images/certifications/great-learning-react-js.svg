  </text>

  <!-- Bottom Right Verification URL -->
  <g transform="translate(1120, 755)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="end">
      To verify this certificate visit <tspan font-weight="700" fill="#0284c7">https://www.mygreatlearning.com/certificate/UHEUKNPI</tspan>
    </text>
