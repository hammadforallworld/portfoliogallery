<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="prompterBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Left Side: Generative Radiating Line Beams -->
  <g stroke="url(#prompterBeam)" stroke-width="2.5" opacity="0.85">
    <line x1="0" y1="0" x2="350" y2="40"/>
    <line x1="0" y1="0" x2="340" y2="80"/>
    <line x1="0" y1="0" x2="330" y2="120"/>
    <line x1="0" y1="0" x2="320" y2="160"/>
    <line x1="0" y1="0" x2="310" y2="200"/>
    <line x1="0" y1="0" x2="300" y2="240"/>
    <line x1="0" y1="0" x2="280" y2="290"/>
    <line x1="0" y1="0" x2="260" y2="340"/>
    <line x1="0" y1="0" x2="240" y2="390"/>
    <line x1="0" y1="0" x2="220" y2="440"/>
    <line x1="0" y1="0" x2="200" y2="490"/>
    <line x1="0" y1="0" x2="180" y2="540"/>
    <line x1="0" y1="0" x2="160" y2="590"/>
    <line x1="0" y1="0" x2="140" y2="640"/>
    <line x1="0" y1="0" x2="110" y2="700"/>
    <line x1="0" y1="0" x2="80" y2="760"/>
    <line x1="0" y1="0" x2="50" y2="800"/>
    <line x1="0" y1="0" x2="20" y2="800"/>
  </g>

  <!-- Bottom Left: QR Code Box -->
  <g transform="translate(70, 620)">
    <rect x="0" y="0" width="130" height="130" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
    <!-- QR patterns -->
    <rect x="12" y="12" width="34" height="34" fill="#0f172a"/>
    <rect x="18" y="18" width="22" height="22" fill="#ffffff"/>
    <rect x="23" y="23" width="12" height="12" fill="#0f172a"/>

    <rect x="84" y="12" width="34" height="34" fill="#0f172a"/>
    <rect x="90" y="18" width="22" height="22" fill="#ffffff"/>
    <rect x="95" y="23" width="12" height="12" fill="#0f172a"/>

    <rect x="12" y="84" width="34" height="34" fill="#0f172a"/>
    <rect x="18" y="90" width="22" height="22" fill="#ffffff"/>
    <rect x="23" y="95" width="12" height="12" fill="#0f172a"/>

    <!-- QR Dots -->
    <rect x="54" y="16" width="8" height="8" fill="#0f172a"/>
    <rect x="66" y="22" width="8" height="8" fill="#0f172a"/>
    <rect x="54" y="38" width="8" height="8" fill="#0f172a"/>
    <rect x="54" y="58" width="10" height="10" fill="#0f172a"/>
    <rect x="70" y="58" width="10" height="10" fill="#0f172a"/>
    <rect x="86" y="58" width="10" height="10" fill="#0f172a"/>
    <rect x="102" y="58" width="10" height="10" fill="#0f172a"/>
    <rect x="54" y="86" width="8" height="8" fill="#0f172a"/>
    <rect x="68" y="96" width="8" height="8" fill="#0f172a"/>
    <rect x="88" y="90" width="8" height="8" fill="#0f172a"/>
    <rect x="104" y="104" width="8" height="8" fill="#0f172a"/>
  </g>

  <!-- ================= TOP HEADER BRANDING ================= -->
  <g transform="translate(390, 80)">
    <!-- Arabic Branding -->
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#0284c7">مليون خبير لأوامر</text>
    <text x="0" y="44" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#0284c7">الذكاء الاصطناعي</text>
    <text x="0" y="74" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#0f172a" letter-spacing="1">1 MILLION PROMPTERS</text>
  </g>

  <!-- ================= CERTIFICATE OF COMPLETION ================= -->
  <g transform="translate(390, 240)">
    <text x="0" y="40" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0f172a" letter-spacing="1">CERTIFICATE</text>
    <text x="0" y="110" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="2">OF</text>
    <text x="50" y="110" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0f172a" letter-spacing="1">COMPLETION</text>
  </g>

  <!-- Presented to statement -->
  <text x="390" y="405" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#475569">This certificate is proudly presented to</text>

  <!-- Recipient Name: Hammad Hassan -->
  <text x="390" y="465" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#0f172a">Hammad Hassan</text>
  <line x1="390" y1="485" x2="1120" y2="485" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Body Description Paragraph -->
  <g transform="translate(390, 520)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#334155" line-height="1.5">
      for successfully completing the One Million Prompters initiative launched by His Highness
    </text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#334155">
      Sheikh Hamdan bin Mohammed bin Rashid Al Maktoum, Crown Prince of Dubai. This initiative
    </text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#334155">
      aims to train and empower One Million Prompters, focusing on developing skills in prompt
    </text>
    <text x="0" y="72" font-family="'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#334155">
      engineering for AI systems. In alignment with the Dubai Universal Blueprint for Artificial
    </text>
    <text x="0" y="96" font-family="'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#334155">
      Intelligence, this achievement contributes to building a future-ready workforce.
    </text>
  </g>

  <!-- ================= BOTTOM LOGOS ================= -->
  <!-- Dubai Future Foundation Circular Seal -->
  <g transform="translate(450, 715)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="#64748b"/>
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#ffffff"/>
    <text x="0" y="46" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#64748b" text-anchor="middle">DUBAI FUTURE FOUNDATION</text>
  </g>

  <!-- Dubai Centre for AI -->
  <g transform="translate(680, 705)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#475569">مركز دبي لاستخدامات</text>
    <text x="0" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0284c7">الذكاء الاصطناعي</text>
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#475569">Dubai Centre for</text>
    <text x="0" y="40" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0284c7">Artificial Intelligence</text>
    <line x1="0" y1="46" x2="110" y2="46" stroke="#0284c7" stroke-width="3"/>
  </g>

  <!-- Dubai Future Foundation Text Logo -->
  <g transform="translate(920, 720)">
    <circle cx="10" cy="5" r="8" fill="#0f172a"/>
    <text x="26" y="2" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#475569">مؤسسة دبي للمستقبل</text>
    <text x="26" y="14" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a">DUBAI FUTURE FOUNDATION</text>
  </g>
</svg>
