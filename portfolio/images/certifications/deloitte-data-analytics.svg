    <path d="M 0 10 C 25 -15, 45 25, 70 -5 C 95 -30, 115 5, 140 -10 M 20 20 C 50 15, 90 20, 130 15" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Tina McCreery</text>
    <text x="0" y="85" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#475569">Chief Human Resources Officer,</text>
    <text x="0" y="108" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#475569">Deloitte</text>
  </g>

