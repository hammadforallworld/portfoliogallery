  <text x="80" y="525" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569">Over the period of June 2026, Hammad Hassan has completed practical tasks in:</text>
  <text x="80" y="565" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">• Data analysis</text>
  <text x="80" y="595" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">• Forensic technology</text>

  <!-- Right Side: Signature & Tina McCreery -->
  <g transform="translate(820, 520)">
