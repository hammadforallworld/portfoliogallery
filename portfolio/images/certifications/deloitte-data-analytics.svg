    <text x="0" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
      Enrolment Verification Code <tspan font-family="'Courier New', monospace" font-weight="700" fill="#64748b">HSBpaBmQedPgQaYQY</tspan> | User Verification Code <tspan font-family="'Courier New', monospace" font-weight="700" fill="#64748b">6a439751dea7e0a1a5947134</tspan> | Issued by <tspan font-weight="700" fill="#475569">Forage</tspan>
