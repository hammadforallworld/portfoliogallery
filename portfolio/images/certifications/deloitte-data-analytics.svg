  <!-- Top Left: Deloitte. Logo -->
  <g transform="translate(80, 70)">
    <text x="0" y="50" font-family="'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" fill="#000000" letter-spacing="-1">Deloitte<tspan fill="#86bc25">.</tspan></text>
  </g>

  <!-- Recipient Name -->
  <text x="80" y="210" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#1e293b" letter-spacing="-0.5">Hammad Hassan</text>

  <!-- Program Title -->
  <text x="80" y="275" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Data Analytics Job Simulation</text>

