<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="adbiWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004b87"/>
      <stop offset="60%" stop-color="#00a3e0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#00558f"/>
    </linearGradient>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Top-Left Corner Geometric Frame -->
  <path d="M 40 40 L 360 40 L 360 46 L 46 46 L 46 360 L 40 360 Z" fill="#0f2e59"/>
  <path d="M 0 0 C 120 0 240 30 320 90 L 290 120 C 220 70 120 40 0 40 Z" fill="#00a3e0" opacity="0.85"/>
  <path d="M 0 0 L 140 0 C 80 40 40 80 0 140 Z" fill="#0f2e59"/>

  <!-- Bottom-Left Sweeping Waves -->
  <path d="M 0 670 Q 200 680 400 760 L 400 800 L 0 800 Z" fill="#00a3e0" opacity="0.3"/>
  <path d="M 0 700 Q 250 710 440 800 L 0 800 Z" fill="url(#adbiWave)"/>

  <!-- Top Center Logo Badge -->
  <g transform="translate(600, 115)">
    <!-- Dotted Circle Outer Ring -->
    <circle cx="0" cy="0" r="48" fill="#0f2e59"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="0" y="-3" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ADBI</text>
    <text x="0" y="16" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="500" fill="#93c5fd" text-anchor="middle">Institute</text>
  </g>

  <!-- Title: Certificate of Completion -->
  <text x="600" y="235" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0f2e59" text-anchor="middle" letter-spacing="-0.5">Certificate of Completion</text>

  <!-- Presented to subtext -->
  <text x="600" y="295" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="middle">This certificate is proudly presented to:</text>

  <!-- Hammad Hassan -->
  <text x="600" y="365" font-family="'Inter', sans-serif" font-size="48" font-weight="800" fill="#0f172a" text-anchor="middle">Hammad Hassan</text>

  <!-- for completing the course -->
  <text x="600" y="425" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="middle">for completing the course:</text>

  <!-- Course Title -->
  <text x="600" y="485" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#004b87" text-anchor="middle">Seizing the Full Potential of AI</text>

  <!-- Issue Date -->
  <text x="600" y="535" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#334155" text-anchor="middle">July 17, 2026</text>

  <!-- Bottom Left: Completed Badge -->
  <g transform="translate(110, 620)">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="url(#badgeGrad)"/>
    <text x="60" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">COMPLETED</text>
    <text x="60" y="46" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#bae6fd" letter-spacing="0.5">ADBI ELEARNING</text>
    <!-- Checkmark Circle -->
    <circle cx="150" cy="30" r="16" fill="#ffffff"/>
    <path d="M 143 30 L 148 35 L 157 24" fill="none" stroke="#0088cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Center: Signature & Dean -->
  <g transform="translate(600, 640)">
    <!-- Signature path approximation -->
    <path d="M -70 -15 C -40 -35, -20 0, 10 -25 C 25 -40, 45 -10, 75 -30 M -50 0 C -20 5, 20 -15, 60 -10" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Bambang Brodjonegoro</text>
    <text x="0" y="42" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">Dean, ADBI</text>
  </g>

  <!-- Bottom Right: QR Code Visual Box -->
  <g transform="translate(970, 600)">
    <rect x="0" y="0" width="110" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- QR Code patterns -->
    <rect x="10" y="10" width="30" height="30" fill="#0f172a"/>
    <rect x="16" y="16" width="18" height="18" fill="#ffffff"/>
    <rect x="20" y="20" width="10" height="10" fill="#0f172a"/>

    <rect x="70" y="10" width="30" height="30" fill="#0f172a"/>
    <rect x="76" y="16" width="18" height="18" fill="#ffffff"/>
    <rect x="80" y="20" width="10" height="10" fill="#0f172a"/>

    <rect x="10" y="70" width="30" height="30" fill="#0f172a"/>
    <rect x="16" y="76" width="18" height="18" fill="#ffffff"/>
    <rect x="20" y="80" width="10" height="10" fill="#0f172a"/>

    <!-- Small matrix dots -->
    <rect x="46" y="14" width="6" height="6" fill="#0f172a"/>
    <rect x="56" y="14" width="6" height="6" fill="#0f172a"/>
    <rect x="46" y="26" width="6" height="6" fill="#0f172a"/>
    <rect x="56" y="32" width="6" height="6" fill="#0f172a"/>
    <rect x="46" y="48" width="8" height="8" fill="#0f172a"/>
    <rect x="60" y="52" width="8" height="8" fill="#0f172a"/>
    <rect x="74" y="52" width="8" height="8" fill="#0f172a"/>
    <rect x="88" y="48" width="6" height="6" fill="#0f172a"/>
    <rect x="48" y="74" width="8" height="8" fill="#0f172a"/>
    <rect x="62" y="80" width="8" height="8" fill="#0f172a"/>
    <rect x="78" y="74" width="8" height="8" fill="#0f172a"/>
    <rect x="90" y="86" width="8" height="8" fill="#0f172a"/>
  </g>
</svg>
