  </defs>
  <rect width="800" height="450" fill="url(#certBg)"/>

  <!-- Certificate Border -->
  <rect x="50" y="30" width="700" height="390" rx="16" fill="#121222" stroke="#655cf6" stroke-width="2"/>
  <rect x="65" y="45" width="670" height="360" rx="12" fill="#0d0d18" stroke="#25253e" stroke-width="1"/>

