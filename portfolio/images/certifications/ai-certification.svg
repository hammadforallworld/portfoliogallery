      <stop offset="50%" stop-color="#141426"/>
      <stop offset="100%" stop-color="#1e1b38"/>
    </linearGradient>
    <linearGradient id="purpleRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#655cf6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
