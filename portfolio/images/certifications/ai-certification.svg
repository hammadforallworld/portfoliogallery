  <text x="400" y="228" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">Generative AI &amp; Conversational Agent Engineering</text>
  <text x="400" y="255" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Awarded for demonstrated excellence in designing stateful AI agents &amp; NLP pipelines</text>

