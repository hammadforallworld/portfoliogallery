    <!-- Screen Bezel Glare / Glass Reflection -->
    <path d="M 36 28 L 300 28 L 90 372 L 36 372 Z" fill="#ffffff" opacity="0.025" pointer-events="none"/>

    <!-- =======================================================================
         MACBOOK LOWER CHASSIS & KEYBOARD BASE
         ======================================================================= -->
    <!-- Base Top Surface -->
    <polygon points="0,385 670,385 640,396 30,396" fill="#2d3038" stroke="#3e414c" stroke-width="0.8"/>
    <!-- Front Lip with Display Opening Indentation -->
    <rect x="290" y="386" width="90" height="4" rx="2" fill="#14151a"/>
    <!-- Base Front Edge -->
    <rect x="30" y="396" width="610" height="5" rx="2.5" fill="#1a1c22"/>
  </g>

  <!-- High-End Luxury Showcase Badges Floating in Studio Scene -->
  <g transform="translate(50, 432)">
    <rect width="180" height="26" rx="13" fill="#161822" stroke="url(#gold-grad)" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#f1d9a7"/>
    <text x="96" y="17" fill="#f8e7c4" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">250+ GUEST MEGA YACHT</text>
  </g>

  <g transform="translate(565, 432)">
    <rect width="185" height="26" rx="13" fill="#161822" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#38bdf8"/>
    <text x="100" y="17" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">LIVE: miamieventyacht.com</text>
  </g>
