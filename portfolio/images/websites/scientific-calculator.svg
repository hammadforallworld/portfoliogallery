<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="calc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#0f1224"/>
      <stop offset="100%" stop-color="#171936"/>
    </linearGradient>

    <!-- App Frame Gradient -->
    <linearGradient id="app-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16182c"/>
      <stop offset="100%" stop-color="#0c0e1a"/>
    </linearGradient>

    <!-- Display Screen Gradient -->
    <linearGradient id="display-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#0b0e1e"/>
    </linearGradient>

    <!-- Operator Accent Gradient -->
    <linearGradient id="op-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Equal Button Gradient -->
    <linearGradient id="eq-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Function Key Gradient -->
    <linearGradient id="fn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2238"/>
      <stop offset="100%" stop-color="#141728"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="calc-grid-pat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(99, 102, 241, 0.05)" stroke-width="1"/>
      <circle cx="30" cy="30" r="1" fill="rgba(6, 182, 212, 0.15)"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="calc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="475" fill="url(#calc-bg)"/>
  <rect width="800" height="475" fill="url(#calc-grid-pat)"/>

  <!-- Atmospheric Glow Orbs -->
  <circle cx="200" cy="140" r="160" fill="#6366f1" opacity="0.12" filter="url(#calc-glow)"/>
  <circle cx="640" cy="360" r="150" fill="#06b6d4" opacity="0.1" filter="url(#calc-glow)"/>

  <!-- Outer Canvas Border -->
  <rect x="20" y="20" width="760" height="435" rx="16" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5"/>

  <!-- Left Showcase Hero Info Panel -->
  <g transform="translate(60, 60)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#06b6d4"/>
    <text x="26" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">WEB APPLICATION</text>

    <!-- Title -->
    <text x="0" y="70" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Scientific</text>
    <text x="0" y="108" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="url(#eq-grad)" letter-spacing="-0.5">Calculator App</text>

    <!-- Subtitle / Spec -->
    <text x="0" y="140" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Advanced Mathematical &amp; Trigonometric Engine</text>

    <!-- Feature Bullet Cards -->
    <g transform="translate(0, 165)">
      <!-- Bullet 1 -->
      <rect x="0" y="0" width="280" height="38" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
      <circle cx="20" cy="19" r="5" fill="#6366f1"/>
      <text x="36" y="23" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Trigonometric (sin, cos, tan)</text>

      <!-- Bullet 2 -->
      <rect x="0" y="46" width="280" height="38" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
      <circle cx="20" cy="65" r="5" fill="#06b6d4"/>
      <text x="36" y="69" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Logarithmic, Powers &amp; Radicals</text>

      <!-- Bullet 3 -->
      <rect x="0" y="92" width="280" height="38" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
      <circle cx="20" cy="111" r="5" fill="#22c55e"/>
      <text x="36" y="115" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Real-Time Precision Parser</text>
    </g>

    <!-- GitHub Badge Pill -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="260" height="32" rx="6" fill="#1e1b4b" stroke="rgba(99, 102, 241, 0.4)"/>
      <path d="M16 16c-3.3 0-6 2.7-6 6 0 2.6 1.7 4.9 4.1 5.7.3.1.4-.1.4-.3v-1.1c-1.7.4-2-8-2-.8-.3-.7-.7-.9-.7-.9-.5-.4 0-.4 0-.4.6 0 .9.6.9.6.5.9 1.4.6 1.7.5.1-.4.2-.6.4-.8-1.3-.1-2.7-.7-2.7-3 0-.7.2-1.2.6-1.6 0-.2-.3-.8.1-1.6 0 0 .5-.2 1.7.6.5-.1 1-.2 1.6-.2s1.1.1 1.6.2c1.2-.8 1.7-.6 1.7-.6.4.8.1 1.4.1 1.6.4.4.6 1 .6 1.6 0 2.3-1.4 2.8-2.7 3 .2.2.4.6.4 1.1v1.7c0 .2.1.4.4.3 2.4-.8 4.1-3.1 4.1-5.7 0-3.3-2.7-6-6-6z" fill="#818cf8" transform="translate(0, -6)"/>
      <text x="36" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">github/calculator-app</text>
    </g>
  </g>

  <!-- Right: Calculator Device Mockup -->
  <g transform="translate(390, 48)">
    <!-- Device Outer Chassis -->
    <rect x="0" y="0" width="350" height="375" rx="20" fill="url(#app-frame)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" filter="drop-shadow(0 16px 36px rgba(0,0,0,0.6))"/>

    <!-- Device Header / Status Bar -->
    <rect x="18" y="16" width="314" height="20" rx="4" fill="none"/>
    <circle cx="28" cy="26" r="3.5" fill="#ef4444"/>
    <circle cx="40" cy="26" r="3.5" fill="#f59e0b"/>
    <circle cx="52" cy="26" r="3.5" fill="#22c55e"/>
    <text x="175" y="29" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">SCIENTIFIC CALC v2.0</text>
    <text x="315" y="29" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="end">DEG</text>

    <!-- Digital LCD Screen Display Box -->
    <rect x="18" y="44" width="314" height="74" rx="10" fill="url(#display-grad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2"/>
    
    <!-- Calculation History Formula -->
    <text x="320" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="end">sin(45°) + log(100) × π</text>
    
    <!-- Active Result Display -->
    <text x="320" y="104" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700" fill="#38bdf8" text-anchor="end">6.990412</text>

    <!-- Keypad Grid (5 Rows x 5 Cols) -->
    <!-- Row 1: Scientific Top Functions -->
    <g transform="translate(18, 128)">
      <rect x="0" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="28" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">sin</text>

      <rect x="64" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="92" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">cos</text>

      <rect x="128" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="156" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">tan</text>

      <rect x="192" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="220" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">log</text>

      <rect x="256" y="0" width="58" height="38" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="rgba(239, 68, 68, 0.4)"/>
      <text x="285" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">AC</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(18, 174)">
      <rect x="0" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="28" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">ln</text>

      <rect x="64" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="92" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>

      <rect x="128" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="156" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">8</text>

      <rect x="192" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="220" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">9</text>

      <rect x="256" y="0" width="58" height="38" rx="8" fill="url(#op-grad)" stroke="rgba(99, 102, 241, 0.4)"/>
      <text x="285" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">÷</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(18, 220)">
      <rect x="0" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="28" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">√x</text>

      <rect x="64" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="92" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>

      <rect x="128" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="156" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>

      <rect x="192" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="220" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>

      <rect x="256" y="0" width="58" height="38" rx="8" fill="url(#op-grad)" stroke="rgba(99, 102, 241, 0.4)"/>
      <text x="285" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">×</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(18, 266)">
      <rect x="0" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="28" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">xʸ</text>

      <rect x="64" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="92" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>

      <rect x="128" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="156" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>

      <rect x="192" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="220" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>

      <rect x="256" y="0" width="58" height="38" rx="8" fill="url(#op-grad)" stroke="rgba(99, 102, 241, 0.4)"/>
      <text x="285" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">-</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(18, 312)">
      <rect x="0" y="0" width="56" height="38" rx="8" fill="url(#fn-grad)" stroke="rgba(255,255,255,0.06)"/>
      <text x="28" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">π</text>

      <rect x="64" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="92" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">0</text>

      <rect x="128" y="0" width="56" height="38" rx="8" fill="#1a1d30" stroke="rgba(255,255,255,0.05)"/>
      <text x="156" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">.</text>

      <rect x="192" y="0" width="56" height="38" rx="8" fill="url(#op-grad)" stroke="rgba(99, 102, 241, 0.4)"/>
      <text x="220" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>

      <rect x="256" y="0" width="58" height="38" rx="8" fill="url(#eq-grad)" stroke="rgba(6, 182, 212, 0.5)"/>
      <text x="285" y="25" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#080e1c" text-anchor="middle">=</text>
    </g>
  </g>
</svg>
