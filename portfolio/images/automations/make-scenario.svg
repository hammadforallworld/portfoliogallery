<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMakeScen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#181329"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgMakeScen)"/>
  
  <rect x="60" y="40" width="680" height="370" rx="14" fill="#131124" stroke="#2c2847" stroke-width="2"/>
  <rect x="60" y="40" width="680" height="45" rx="14" fill="#1b1733"/>
  <circle cx="90" cy="62" r="6" fill="#10b981"/>
  <text x="110" y="67" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Make.com Scenario Canvas: Auto-Plan Compiler</text>

  <!-- Node map grid -->
  <rect x="90" y="115" width="280" height="110" rx="10" fill="#1e193b" stroke="#655cf6" stroke-width="1.5"/>
  <text x="110" y="145" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Module 1: Webhook Listener</text>
  <text x="110" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#a5b4fc">Method: POST • Status: 200 OK</text>
  <text x="110" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Payload: User Metrics, Dietary Restrictions</text>

  <rect x="430" y="115" width="280" height="110" rx="10" fill="#1e193b" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="145" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Module 2: OpenAI Assistant</text>
  <text x="450" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">Model: GPT-4o • Temperature: 0.2</text>
  <text x="450" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Output: JSON structured 7-day schedule</text>

  <rect x="90" y="255" width="280" height="110" rx="10" fill="#1e193b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="110" y="285" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Module 3: PDF Document Builder</text>
  <text x="110" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#7dd3fc">Template ID: #tmpl-aura-2026</text>
  <text x="110" y="335" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Generates vector-ready print PDF</text>

  <rect x="430" y="255" width="280" height="110" rx="10" fill="#1e193b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="450" y="285" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Module 4: Email &amp; Cloud Storage</text>
  <text x="450" y="310" font-family="'Inter', sans-serif" font-size="11" fill="#fda4af">Google Drive + SMTP / Gmail</text>
  <text x="450" y="335" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Delivered to recipient with tracking ID</text>
</svg>
