  <text x="510" y="186" font-family="'Inter', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">✦</text>

  <rect x="540" y="90" width="180" height="250" rx="10" fill="#171426" stroke="#8b5cf6" stroke-width="2" transform="rotate(4 540 90)"/>
