  <rect x="560" y="170" width="140" height="90" rx="8" fill="#2a1f42"/>
  <text x="630" y="215" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Visual Hierarchy</text>
