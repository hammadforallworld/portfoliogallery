  <text x="100" y="200" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Visual communication tailored for digital growth.</text>
  <text x="100" y="225" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">• High-conversion social carousels &amp; banners</text>
  <text x="100" y="250" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">• Corporate presentation deck design</text>
  <text x="100" y="275" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">• Vector iconography &amp; vector art assets</text>

  <!-- Graphic Design Artwork Mockups -->
  <rect x="440" y="60" width="160" height="230" rx="10" fill="#1f1830" stroke="#ec4899" stroke-width="2" transform="rotate(-6 440 60)"/>
  <text x="495" y="125" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">POSTER</text>
